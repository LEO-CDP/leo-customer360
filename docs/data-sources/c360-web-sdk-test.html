<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Shop</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #667085;
            --brand: #635bff;
            --bg: #f6f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 16px system-ui, -apple-system, Segoe UI, sans-serif;
            color: var(--ink);
            background: var(--bg);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 7%;
            background: #fff;
            border-bottom: 1px solid #e7e9ef;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--brand);
        }

        header button {
            border: 0;
            background: #eef0ff;
            color: var(--brand);
            padding: 10px 15px;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 700;
        }

        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .hero {
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        .hero p {
            margin: 0;
            color: var(--muted);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            overflow: hidden;
            background: #fff;
            border: 1px solid #e7e9ef;
            border-radius: 16px;
            box-shadow: 0 5px 18px #1720330b;
        }

        .product-image {
            display: grid;
            place-items: center;
            height: 170px;
            font-size: 4.5rem;
            background: linear-gradient(135deg, #edf0ff, #fef2e8);
        }

        .details {
            padding: 18px;
        }

        .details h2 {
            margin: 0 0 6px;
            font-size: 1.1rem;
        }

        .details p {
            min-height: 44px;
            margin: 0 0 15px;
            color: var(--muted);
            font-size: .9rem;
        }

        .buy {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .price {
            font-weight: 800;
        }

        .buy button {
            border: 0;
            border-radius: 8px;
            padding: 10px 13px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
        }

        .buy button:hover {
            background: #5149df;
        }

        #message {
            min-height: 24px;
            margin-top: 25px;
            color: #18804b;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Northstar Market</div><button id="cart" type="button">Cart (0)</button>
    </header>
    <main>
        <section class="hero">
            <h1>Everyday essentials.</h1>
            <p>A small storefront for testing product views, cart actions, and sample customer events.</p>
        </section>
        <section class="products" id="products" aria-label="Products"></section>
        <div id="message" role="status"></div>
    </main>
    <script>
        const products = [
            { id: 1, name: 'Cloud Runner Sneakers', price: 89, icon: '👟', description: 'Lightweight shoes for daily adventures.' },
            { id: 2, name: 'Canvas Daypack', price: 54, icon: '🎒', description: 'A durable, roomy bag for work or travel.' },
            { id: 3, name: 'Ceramic Travel Mug', price: 24, icon: '☕', description: 'Keep your coffee warm on the go.' },
            { id: 4, name: 'Classic Watch', price: 120, icon: '⌚', description: 'Minimal style with a comfortable leather band.' }
        ];
        let cartCount = 0;
        const productList = document.querySelector('#products');
        const cartButton = document.querySelector('#cart');
        const message = document.querySelector('#message');

        products.forEach(product => {
            const card = document.createElement('article');
            card.className = 'card';
            card.innerHTML = `<div class="product-image" aria-hidden="true">${product.icon}</div>
				<div class="details"><h2>${product.name}</h2><p>${product.description}</p>
				<div class="buy"><span class="price">$${product.price.toFixed(2)}</span><button type="button" data-id="${product.id}">Add to cart</button></div></div>`;
            productList.appendChild(card);
        });

        productList.addEventListener('click', event => {
            if (!event.target.matches('button')) return;
            const product = products.find(item => item.id === Number(event.target.dataset.id));
            cartCount++;
            cartButton.textContent = `Cart (${cartCount})`;
            message.textContent = `${product.name} added to your cart.`;
            if (window.LeoObserver && typeof window.LeoObserver.recordEventConversion === 'function') {
                LeoObserver.recordEventConversion(
                    'order_' + Date.now(),
                    product.price,
                    'USD',
                    [{ id: product.id, name: product.name, price: product.price, quantity: 1 }],
                    { item_name: product.name, item_id: product.id }
                );
            }
        });
        cartButton.addEventListener('click', () => {
            message.textContent = cartCount ? `You have ${cartCount} item${cartCount === 1 ? '' : 's'} in your cart.` : 'Your cart is empty.';
        });
    </script>

    <script>
        // (1) CDP_EVENT_OBSERVER: load JavaScript code for [C360 Tracker]
        (function () {
            // Data Source ID (from sys_data_source.data_source_id)
            window.leoC360DataSourceId = "15dc39d4-ae42-5c60-9c77-66f05dcae448";

            // Default batch size of Event Tracking
            window.leoTrackingBatchSize = 10;

            // Tracking Log Domain and Endpoint URI
            window.leoTrackingEndpoint = "https://c360.example.com/data/api/v1/tracking/logs";
   
            // Data Touchpoint Metadata 
            window.srcTouchpointName = encodeURIComponent(document.title);
            window.srcTouchpointUrl = encodeURIComponent(location.href);

            // Dynamic Loader for the Main Proxy CDP JS
            var src = "https://c360.example.com/data/cdp-sdk/observer/leo.proxy.js";
            var jsNode = document.createElement('script');
            jsNode.async = true;
            jsNode.defer = true;
            jsNode.src = src;
            var s = document.getElementsByTagName('script')[0];
            s.parentNode.insertBefore(jsNode, s);
        })();

        // ready
        function leoObserverProxyReady(session) {
            // auto tracking when CDP JS is ready
            if (window.LeoObserver && typeof window.LeoObserver.recordEventPageView === 'function') {
                LeoObserver.recordEventPageView();
            }
        }
    </script>
</body>

</html>
