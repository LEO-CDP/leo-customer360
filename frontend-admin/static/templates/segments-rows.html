{{#each segments}}
<tr class="border-t border-slate-100 hover:bg-slate-50 transition-colors cursor-pointer segment-row" data-id="{{segment_id}}">
  <td class="px-4 py-3">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 shrink-0 rounded-full {{domainIconBg}} flex items-center justify-center text-base">{{domainIcon}}</div>
      <div class="min-w-0">
        <div class="font-medium text-slate-800 truncate">{{segment_name}}</div>
        <span class="inline-block text-[11px] font-mono text-slate-400 bg-slate-50 border border-slate-100 rounded px-1.5 py-0.5 mt-0.5">{{segment_tag}}</span>
      </div>
    </div>
  </td>
  <td class="px-4 py-3 capitalize">{{domainLabel}}</td>
  <td class="px-4 py-3">
    <span class="px-2 py-0.5 rounded-full text-xs font-medium {{processedByBadgeClass}}">{{processedByLabel}}</span>
  </td>
  <td class="px-4 py-3">{{memberCountLabel}}</td>
  <td class="px-4 py-3">
    <span class="px-2 py-0.5 rounded-full text-xs font-medium {{activeBadgeClass}}">{{activeLabel}}</span>
  </td>
  <td class="px-4 py-3 text-slate-500">{{createdLabel}}</td>
  <td class="px-4 py-3 text-right"><span class="text-indigo-600 text-xs font-medium">View &rarr;</span></td>
</tr>
{{/each}}
