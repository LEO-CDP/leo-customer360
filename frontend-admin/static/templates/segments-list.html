<div class="bg-white border border-slate-200 rounded-xl shadow-sm">
  <div class="p-4 border-b border-slate-200 flex flex-wrap items-center gap-3">
    <h1 class="text-lg font-semibold flex-1">
      Segments <br>
       <span class="text-xs text-slate-400">Audience Builder — click a segment to see its matched profiles</span>
    </h1>
   
    <!-- Create new segment -->
    <button id="btn-segments-create" class="bg-indigo-600 text-white rounded-lg px-3 py-1.5 hover:bg-indigo-700 transition-colors">Create segment</button>

    <!-- Refresh segments with member data -->
    <button id="btn-segments-refresh" class="bg-slate-100 text-slate-600 rounded-lg px-3 py-1.5 hover:bg-slate-200 transition-colors">Refresh</button>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead id="segments-thead" class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide sticky top-0 z-10"></thead>
      <tbody id="segments-tbody"></tbody>
    </table>
  </div>
  <div id="segments-list-loading" class="p-6 flex justify-center"><div class="spinner"></div></div>
  <div id="segments-list-empty" class="hidden p-10 text-center text-sm text-slate-500">
    <div class="text-3xl mb-2">🗂️</div>
    No segments defined yet.
  </div>
  <div class="p-4 border-t border-slate-200 flex items-center justify-between text-sm text-slate-500">
    <span id="segments-count-label"></span>
    <button id="btn-segments-load-more" class="hidden border border-slate-300 rounded-lg px-3 py-1.5 hover:bg-slate-50 transition-colors">Load more</button>
  </div>
</div>
