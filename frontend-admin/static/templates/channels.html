<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
  <h3 class="font-semibold text-sm mb-3">Channels &amp; Identifiers</h3>
  <ul class="space-y-2 text-sm">
    {{#each channels}}
    <li class="flex items-center justify-between">
      <span>{{icon}} {{label}}</span>
      <span class="text-xs text-slate-400">{{badge}}</span>
    </li>
    {{/each}}
  </ul>
</div>

{{#if hasAttributes}}
<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
  <h3 class="font-semibold text-sm mb-3">Other Attributes</h3>

  <ul class="divide-y divide-slate-100">
    {{#each attributeChips}}
    <li class="flex justify-between items-start py-2 gap-4">
      <span class="text-sm text-slate-500">
        {{label}}
      </span>

      <span class="text-sm font-semibold text-slate-900 text-right break-all">
        {{value}}
      </span>
    </li>
    {{/each}}
  </ul>
</div>
{{/if}}
