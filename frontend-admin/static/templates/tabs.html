<!-- 
  =============================================================================
  MODERN DASHBOARD HEADER & NAVIGATION
  =============================================================================
  Features:
  - Sticky top layout with backdrop blur for a modern SaaS header feel
  - Clean brand logo with indigo theme and typography
  - Modernized period selector dropdown and action buttons with crisp icons
  - Styled navigation tabs with active states, hover transitions, and padding
-->
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
  
  <!-- Top Brand & Actions Bar -->
  <div class="max-w-[1600px] mx-auto px-6 py-3.5 flex items-center justify-between gap-4">
    
    <!-- Brand / Logo Area -->
    <div class="flex items-center gap-3.5">
      <a href="#/overview"
        class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-indigo-600 to-indigo-700
              text-white flex items-center justify-center font-bold text-sm
              shadow-md shadow-indigo-200 ring-2 ring-indigo-50
              hover:shadow-lg hover:shadow-indigo-200 transition-all duration-200"
        aria-label="Customer 360" > C360
      </a>

      <div class="min-w-0">
        <a href="#/overview"
          class="block text-sm font-bold text-slate-900 leading-tight tracking-tight
                hover:text-indigo-600 transition-colors"
        > Customer 360
        </a>

        <div class="text-xs text-slate-400 font-medium leading-tight mt-1">
          Customer Data Platform
        </div>
      </div>
    </div>

    <!-- Actions Area -->
    <div class="flex items-center gap-3">
      
      <!-- Period Select Container -->
      <div id="data-period-select-container" class="flex items-center gap-2 hidden">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider hidden sm:block">Period</label>
        <select id="data-period-select" class="text-xs border border-slate-200/80 bg-slate-50/50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-xl px-3 py-2 text-slate-700 shadow-sm outline-none cursor-pointer font-medium">
          <option value="3">Last 3 days</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="90" selected>Last 90 days</option>
          <option value="180">Last 180 days</option>
          <option value="365">Last 365 days</option>
        </select>
      </div>

      <!-- Export PDF Button -->
      <button id="btn-export-pdf" class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-3.5 py-2 text-xs font-semibold transition-all shadow-sm shadow-indigo-100">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
        <span>Export PDF</span>
      </button>

      <!-- Admin / Settings Button -->
      <button id="btn-settings" title="API connection settings" class="inline-flex items-center gap-2 border border-slate-200/80 bg-white hover:bg-slate-50 rounded-xl px-3.5 py-2 text-xs font-semibold text-slate-700 transition-all shadow-sm">
        <span id="api-status-dot" class="w-2 h-2 rounded-full bg-slate-300 ring-2 ring-slate-100"></span>
        <span>Settings</span>
      </button>

    </div>
  </div>

  <!-- Navigation Bar -->
  <nav class="max-w-[1600px] mx-auto px-6 flex gap-8 text-sm font-semibold overflow-x-auto scrollbar-none border-t border-slate-100">
    <button title="System health, recent activities, and key performance metrics" data-tab="overview" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Overview</button>
    <button title="Detailed analytics and insights" data-tab="analytics" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Analytics</button>
    
    <button title="Manage customer profiles" data-tab="profiles" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Profiles</button>
    <button title="Manage customer personas" data-tab="personas" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Personas</button>

    <button title="Manage customer segments" data-tab="segments" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Segments</button>
    <button title="Manage marketing campaigns" data-tab="campaigns" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Campaigns</button>
    
    <button title="Manage data sources" data-tab="datasources" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Data Sources</button>
    <button title="Manage customer attributes" data-tab="attributes" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Attributes</button>

    <button title="Manage scoring rules and configurations" data-tab="scoring" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Scoring</button>
    <button title="Administer system settings and configurations" data-tab="admin" class="tab-btn py-3.5 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 whitespace-nowrap transition-colors">Admin</button>
  </nav>

</header>
