<!-- 
  =============================================================================
  TIMELINE ACTIVITY CARD
  =============================================================================
-->
<div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 p-6">
  
  <!-- Card Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <div class="p-1.5 bg-indigo-50 text-indigo-600 rounded-lg">
        <!-- History / Clock Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h3 class="font-semibold text-slate-900 text-base">Timeline</h3>
    </div>
    
    {{#if hasTimeline}}
    <button id="btn-timeline-more" class="text-xs text-indigo-600 hover:text-indigo-700 font-semibold px-2.5 py-1 rounded-lg hover:bg-indigo-50 transition-colors">
      Load more
    </button>
    {{/if}}
  </div>

  {{#if hasTimeline}}
  <!-- Vertical Thread Container -->
  <div class="relative pl-6 space-y-4 before:absolute before:left-2 before:top-3 before:bottom-3 before:w-0.5 before:bg-slate-100">
    {{#each timeline}}
    <div class="relative flex items-start group">
      
      <!-- Node Dot / Bullet Marker -->
      <div class="absolute -left-6 mt-1.5 w-3.5 h-3.5 rounded-full bg-white border-2 border-indigo-500 ring-4 ring-white group-hover:scale-125 group-hover:border-indigo-600 transition-all"></div>
      
      <!-- Activity Item Box -->
      <div class="w-full flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3.5 bg-slate-50/50 hover:bg-slate-50 rounded-xl border border-slate-100/80 transition-all">
        <div>
          <!-- Title with optional icon/emoji support -->
          <div class="text-sm font-semibold text-slate-800 flex items-center gap-2">
            {{#if icon}}<span class="text-base">{{icon}}</span>{{/if}}
            <span>{{title}}</span>
          </div>
          
          <!-- Metadata line -->
          <div class="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
            <span>{{timeLabel}}</span>
            <span class="text-slate-300">&bull;</span>
            <span class="font-medium text-slate-500">{{channelLabel}}</span>
          </div>
        </div>

        <!-- Optional Amount Badge -->
        {{#if amountLabel}}
        <span class="text-xs font-semibold bg-white border border-slate-200/80 text-slate-700 rounded-lg px-2.5 py-1 whitespace-nowrap shadow-sm self-start sm:self-center">
          {{amountLabel}}
        </span>
        {{/if}}
      </div>
      
    </div>
    {{/each}}
  </div>
  {{else}}
    <!-- Refined Empty State -->
    <div class="flex items-center justify-center gap-2 px-3 py-6 w-full rounded-xl border border-dashed border-slate-200 bg-slate-50 text-slate-400 text-sm italic">
      No recent activity recorded for this profile
    </div>
  {{/if}}
</div>
