<!-- 
  =============================================================================
  MASTER PROFILES TABLE CARD
  =============================================================================
  UX/UI Improvements:
  1. Filter Alignment: Removed the inline label on the Linked Profile Count to maintain perfectly flush alignment with the select dropdowns.
  2. Table Styling: Added stronger borders and defined hover state classes for the eventual table rows to ensure readability.
  3. Empty & Loading States: Replaced the basic emoji/spinner with professional Tailwind-based SVG icons, animations (animate-spin), and improved whitespace padding.
  4. Footer/Pagination: Upgraded button states (focus rings, disabled opacity) and integrated the footer seamlessly into the card's bottom radius.
  =============================================================================
-->
<div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col h-full overflow-hidden">

  <!-- Header & Filters Section -->
  <div class="p-6 border-b border-slate-200 bg-white flex flex-col gap-5 shrink-0">
    
    <!-- Top Row: Title & Primary Search -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- Title & Icon -->
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-lg shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
          </svg>
        </div>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">Master Profiles</h1>
      </div>

      <!-- Search Input -->
      <div class="relative w-full md:w-80">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </span>
        <input 
          id="search-input" 
          type="search" 
          placeholder="Search name, persona, email, phone…" 
          class="text-sm border border-slate-300 bg-slate-50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-lg pl-10 pr-4 py-2.5 w-full text-slate-700 placeholder-slate-400 shadow-sm outline-none" 
        />
      </div>
    </div>
  
    <!-- Bottom Row: Filter Controls -->
    <div class="flex flex-wrap items-center gap-3">
      
      <!-- Domain Filter -->
      <select id="domain-filter" class="text-sm border border-slate-300 bg-white hover:bg-slate-50 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-lg px-3 py-2.5 text-slate-700 shadow-sm outline-none cursor-pointer min-w-[140px]">
        <option value="">All domains</option>
      </select>

      <!-- Lifecycle Filter -->
      <select id="lifecycle-filter" class="text-sm border border-slate-300 bg-white hover:bg-slate-50 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-lg px-3 py-2.5 text-slate-700 shadow-sm outline-none cursor-pointer min-w-[160px]">
        <option value="">All lifecycle stages</option>
        <option value="prospect">Prospect</option>
        <option value="lead">Lead</option>
        <option value="customer">Customer</option>
        <option value="vip">VIP</option>
        <option value="dormant">Dormant</option>
        <option value="churn_risk">Churn risk</option>
      </select>

      <!-- Tier Filter -->
      <select id="tier-filter" class="text-sm border border-slate-300 bg-white hover:bg-slate-50 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-lg px-3 py-2.5 text-slate-700 shadow-sm outline-none cursor-pointer min-w-[120px]">
        <option value="">All tiers</option>
        <option value="Silver">Silver</option>
        <option value="Gold">Gold</option>
        <option value="Platinum">Platinum</option>
      </select>

      <!-- Churn Risk Filter -->
      <select id="churn-risk-filter" class="text-sm border border-slate-300 bg-white hover:bg-slate-50 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-lg px-3 py-2.5 text-slate-700 shadow-sm outline-none cursor-pointer min-w-[140px]">
        <option value="">All churn risks</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>

      <!-- Linked Raw Profile Count -->
      <div class="relative flex-grow sm:flex-grow-0">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
          </svg>
        </span>
        <input 
          id="linked-raw-profile-count-input" 
          type="number" 
          min="0"
          placeholder="Min linked profiles..." 
          title="Minimum Linked Raw Profiles"
          class="text-sm border border-slate-300 bg-white hover:bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-lg pl-9 pr-3 py-2.5 w-full sm:w-48 text-slate-700 placeholder-slate-400 shadow-sm outline-none" 
        />
      </div>

    </div>
  </div>

  <!-- Table Container (Flex-1 ensures it pushes footer down if content is small) -->
  <div class="overflow-x-auto flex-1 bg-white relative min-h-[300px]">
    <table class="w-full text-sm text-left whitespace-nowrap">
      <thead id="profiles-thead" class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider font-bold border-b border-slate-200 sticky top-0 z-10">
        <!-- 
          Example Injection format for TH:
          <th class="px-6 py-3">Profile ID</th> 
        -->
      </thead>
      <!-- 
        Example Injection format for TBODY TR:
        <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-100 last:border-none">...</tr>
      -->
      <tbody id="profiles-tbody" class="divide-y divide-slate-100"></tbody>
    </table>

    <!-- Loading State (Overlay or Inline) -->
    <div id="list-loading" class="absolute inset-0 z-20 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center p-12">
      <!-- Modern Tailwind Spinner -->
      <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-indigo-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-sm font-medium text-slate-500">Loading profiles...</span>
    </div>

    <!-- Empty State -->
    <div id="list-empty" class="hidden absolute inset-0 z-10 flex flex-col items-center justify-center p-12 text-center bg-white">
      <div class="w-16 h-16 mb-4 rounded-full bg-slate-50 flex items-center justify-center text-slate-300">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v16.5c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9zm3.75 11.625a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
        </svg>
      </div>
      <div class="font-bold text-slate-700 text-base">No profiles matched your filters</div>
      <p class="text-sm text-slate-500 mt-1 max-w-sm">Try adjusting your search query, domain, or filter criteria to find what you're looking for.</p>
      
      <button onclick="document.getElementById('search-input').value=''; document.getElementById('search-input').focus();" class="mt-4 text-sm font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">
        Clear search
      </button>
    </div>
  </div>

  <!-- Footer Pagination / Counts -->
  <div class="p-4 px-6 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-500 bg-slate-50 shrink-0">
    <span id="list-count-label" class="font-medium text-slate-600">Showing <span class="font-bold text-slate-900">0</span> results</span>
    
    <div class="flex items-center gap-3">
      <button 
        id="btn-page-prev" 
        class="border border-slate-300 bg-white rounded-lg px-4 py-2 font-semibold text-slate-700 hover:bg-slate-50 hover:border-slate-400 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-slate-300">
        Previous
      </button>
      
      <span id="list-page-label" class="min-w-[5rem] text-center font-medium text-slate-600">Page 1</span>
      
      <button 
        id="btn-page-next" 
        class="border border-slate-300 bg-white rounded-lg px-4 py-2 font-semibold text-slate-700 hover:bg-slate-50 hover:border-slate-400 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-slate-300">
        Next
      </button>
      
      <!-- Hidden load more button preserved for logic binding -->
      <button id="btn-load-more" class="hidden" aria-hidden="true" tabindex="-1">Load more</button>
    </div>
  </div>

</div>
