<!-- 
  =============================================================================
  CUSTOMER 360 PROFILE DETAIL - 3-COLUMN DASHBOARD GRID LAYOUT
  =============================================================================
  Features:
  - Responsive 12-column grid layout (automatically collapses to a single column on mobile screens)
  - Balanced column spans: Left (3 cols), Center (6 cols), Right (3 cols)
  - Consistent vertical rhythm (`space-y-6`) and gap spacing (`gap-6`) matching the modern card design system
  - Centered max-width container wrapper for large screen layouts
-->
<div class="max-w-[1600px] mx-auto px-6 py-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: Identity & Channels -->
    <div class="lg:col-span-3 space-y-6">
      {{> identity}}
      {{> persona}}
      {{> channels}}
    </div>

    <!-- CENTER COLUMN: Overview, Segments, Engagement, Activity & Timeline -->
    <div class="lg:col-span-6 space-y-6">
      {{> overview}}     
      {{> segments}}
      {{> engagement}}
      {{> activity}}
       {{> domain-attributes}}
      {{> [linked-raw-profiles]}}
      {{> timeline}}
    </div>

    <!-- RIGHT COLUMN: Scoring & Personalized Items -->
    <div class="lg:col-span-3 space-y-6">
      {{> scoring}}

      {{> [personalized-items]}}
    </div>

  </div>
</div>
