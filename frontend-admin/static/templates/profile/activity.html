<!-- 
  =============================================================================
  CROSS-CHANNEL ACTIVITY CARD
  =============================================================================
-->
<div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 p-6">
  
  <!-- Card Header with Icon -->
  <div class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-2">
      <div class="p-1.5 bg-indigo-50 text-indigo-600 rounded-lg">
        <!-- Device/Omnichannel Network Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
        </svg>
      </div>
      <h3 class="font-semibold text-slate-900 text-base">Cross-Channel Activity</h3>
    </div>
    <span class="text-xs font-medium px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full">
      Last {{periodDays}} days
    </span>
  </div>

  <!-- Metrics Grid -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
    
    <!-- App Sessions -->
    <div class="border border-slate-200/70 bg-slate-50/50 rounded-xl p-4 transition-all hover:bg-white hover:border-indigo-200 hover:shadow-sm group">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">App Sessions</span>
        <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" /></svg>
      </div>
      <div class="text-lg font-bold text-slate-900">{{appSessions}}</div>
    </div>

    <!-- Web Sessions -->
    <div class="border border-slate-200/70 bg-slate-50/50 rounded-xl p-4 transition-all hover:bg-white hover:border-indigo-200 hover:shadow-sm group">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Web Sessions</span>
        <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" /></svg>
      </div>
      <div class="text-lg font-bold text-slate-900">{{webSessions}}</div>
    </div>

    <!-- Customer Service -->
    <div class="border border-slate-200/70 bg-slate-50/50 rounded-xl p-4 transition-all hover:bg-white hover:border-indigo-200 hover:shadow-sm group">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Customer Service</span>
        <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-1.745-1.725 41.02 41.02 0 00-10.83 0 2.125 2.125 0 00-1.745 1.725c-.068.432-.125.867-.17 1.307m0 0A32.748 32.748 0 014.5 12.5c0 1.083.076 2.158.225 3.225m9.345-8.334a41.031 41.031 0 00-10.83 0m0 0A2.125 2.125 0 001.5 10.608v4.286c0 .97.616 1.813 1.5 2.097m0 0l3 3m0 0a41.05 41.05 0 0010.83 0" /></svg>
      </div>
      <div class="text-lg font-bold text-slate-900">{{customerServiceContacts}}</div>
    </div>

    <!-- Transactions -->
    <div class="border border-slate-200/70 bg-slate-50/50 rounded-xl p-4 transition-all hover:bg-white hover:border-indigo-200 hover:shadow-sm group">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Transactions</span>
        <svg class="w-4 h-4 text-slate-300 group-hover:text-emerald-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" /></svg>
      </div>
      <div class="text-lg font-bold text-slate-900">{{channelTransactions}}</div>
    </div>

  </div>
</div>
