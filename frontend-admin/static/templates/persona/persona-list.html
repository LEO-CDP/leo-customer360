<div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
  <div class="p-6 border-b border-slate-200 bg-white flex flex-col gap-4">
    <div class="flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-slate-900">Persona Management</h2>
          <p class="text-xs text-slate-500">Manage computed personas and monitor persona analytics.</p>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap items-end gap-3">
      <div>
        <label for="persona-domain-filter" class="block text-[11px] text-slate-500 font-semibold mb-1">Domain</label>
        <select id="persona-domain-filter" class="text-sm border border-slate-300 bg-white rounded-lg px-3 py-2 text-slate-700 shadow-sm outline-none min-w-[150px]">
          <option value="">All domains</option>
        </select>
      </div>
      <div>
        <label for="persona-status-filter" class="block text-[11px] text-slate-500 font-semibold mb-1">Status</label>
        <select id="persona-status-filter" class="text-sm border border-slate-300 bg-white rounded-lg px-3 py-2 text-slate-700 shadow-sm outline-none min-w-[150px]">
          <option value="">All</option>
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>
    </div>
  </div>

  <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-4 border-b border-slate-100 bg-slate-50/40">
    <div class="rounded-xl border border-slate-200 bg-white px-4 py-3">
      <div class="text-[11px] uppercase tracking-wider font-semibold text-slate-500">Total Personas</div>
      <div id="persona-kpi-total" class="mt-1 text-2xl font-black text-slate-900">0</div>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white px-4 py-3">
      <div class="text-[11px] uppercase tracking-wider font-semibold text-slate-500">Active / Inactive</div>
      <div id="persona-kpi-active-inactive" class="mt-1 text-2xl font-black text-slate-900">0 / 0</div>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white px-4 py-3">
      <div class="text-[11px] uppercase tracking-wider font-semibold text-slate-500">Avg Confidence</div>
      <div id="persona-kpi-confidence" class="mt-1 text-2xl font-black text-slate-900">0%</div>
    </div>
  </div>

  <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 border-b border-slate-100">
    <div class="rounded-xl border border-slate-200 bg-white p-4">
      <h3 class="text-sm font-bold text-slate-900 mb-3">Personas by Category</h3>
      <div class="h-64"><canvas id="chart-persona-category"></canvas></div>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-4">
      <h3 class="text-sm font-bold text-slate-900 mb-3">Personas by Risk Level</h3>
      <div class="h-64"><canvas id="chart-persona-risk"></canvas></div>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left">
      <thead id="personas-thead" class="bg-slate-50/80 text-slate-400 text-[11px] uppercase tracking-wider font-semibold border-b border-slate-100 sticky top-0 z-10"></thead>
      <tbody id="personas-tbody" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>

  <div id="personas-loading" class="p-12 flex justify-center">
    <div class="spinner"></div>
  </div>

  <div id="personas-empty" class="hidden p-12 text-center text-sm text-slate-400">
    <div class="font-medium text-slate-600">No personas matched your filters</div>
  </div>

  <div class="p-4 px-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 bg-slate-50/30">
    <span id="personas-count-label" class="font-medium"></span>
    <button id="btn-personas-load-more" class="border border-slate-200/80 bg-white rounded-lg px-3 py-1.5 font-semibold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-colors shadow-sm">Load more</button>
  </div>
</div>
