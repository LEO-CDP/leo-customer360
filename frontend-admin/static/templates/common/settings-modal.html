<!-- 
  =============================================================================
  USER INFORMATION & SETTINGS MODAL
  =============================================================================
  Features:
  - Modal for user to view and edit global settings (API base URL, tenant ID, etc.)
  - View basic information about the current user (username, email, roles, etc.)
  - Settings are persisted in localStorage and applied to all subsequent API calls
  - User can log out from the modal
  - User can swich between tenants (if multi-tenant support is enabled)
  - User can switch between dark and light mode (using Dark mode in tailwindcss)

-->
<div id="user-settings-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-2xl p-6 border border-slate-100 dark:border-slate-700">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between gap-3 mb-5 pb-3 border-b border-slate-100 dark:border-slate-700">
      <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-50 text-indigo-600 rounded-xl">
        <!-- Settings / Cog Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a6.932 6.932 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.332.183-.582.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-900 dark:text-slate-100 tracking-tight">User Information &amp; Settings</h2>
        <p class="text-xs text-slate-400 dark:text-slate-400">Configure API, tenant context, auth token, and theme</p>
      </div>
    </div>
      <button id="btn-settings-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg leading-none">&times;</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <div class="space-y-3 border border-slate-100 dark:border-slate-700 rounded-xl p-4 bg-slate-50/60 dark:bg-slate-800/50">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-300">Current User</h3>
        <div>
          <p class="text-[11px] text-slate-400">Username</p>
          <p id="settings-user-username" class="text-sm font-medium text-slate-700 dark:text-slate-100">-</p>
        </div>
        <div>
          <p class="text-[11px] text-slate-400">Email</p>
          <p id="settings-user-email" class="text-sm font-medium text-slate-700 dark:text-slate-100 break-all">-</p>
        </div>
        <div>
          <p class="text-[11px] text-slate-400">Roles</p>
          <p id="settings-user-roles" class="text-sm font-medium text-slate-700 dark:text-slate-100">-</p>
        </div>
        <div>
          <p class="text-[11px] text-slate-400">Auth Mode</p>
          <p id="settings-auth-mode" class="text-sm font-medium text-slate-700 dark:text-slate-100">-</p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">API Base URL</label>
          <input id="settings-api-base" type="text" placeholder="https://api.example.com" class="w-full text-xs border border-slate-200/80 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 hover:bg-white dark:hover:bg-slate-700 focus:bg-white dark:focus:bg-slate-700 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-xl px-3.5 py-2.5 text-slate-700 dark:text-slate-100 placeholder-slate-400 shadow-sm outline-none" />
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Tenant ID <span class="normal-case text-slate-300 font-normal">(X-Tenant-Id header, dev RLS)</span></label>
          <input id="settings-tenant-id" type="text" placeholder="00000000-0000-0000-0000-000000000000" class="w-full text-xs font-mono border border-slate-200/80 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 hover:bg-white dark:hover:bg-slate-700 focus:bg-white dark:focus:bg-slate-700 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-xl px-3.5 py-2.5 text-slate-700 dark:text-slate-100 placeholder-slate-400 shadow-sm outline-none" />
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Access Token <span class="normal-case text-slate-300 font-normal">(optional bearer token)</span></label>
          <input id="settings-access-token" type="password" placeholder="eyJhbGciOi..." class="w-full text-xs font-mono border border-slate-200/80 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 hover:bg-white dark:hover:bg-slate-700 focus:bg-white dark:focus:bg-slate-700 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-xl px-3.5 py-2.5 text-slate-700 dark:text-slate-100 placeholder-slate-400 shadow-sm outline-none" />
          <p class="text-[11px] text-slate-400 mt-1">Used for Authorization: Bearer &lt;token&gt; when SSO is enabled.</p>
        </div>

        <div class="space-y-2 border border-slate-100 dark:border-slate-700 rounded-xl p-3.5">
          <div class="flex items-center justify-between gap-3">
            <p class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Tenant Switcher</p>
            <label class="inline-flex items-center gap-2 text-xs text-slate-600 dark:text-slate-200">
              <input id="settings-multi-tenant-enabled" type="checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
              Enable
            </label>
          </div>
          <select id="settings-tenant-select" class="w-full text-xs border border-slate-200/80 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 text-slate-700 dark:text-slate-100"></select>
          <textarea id="settings-tenant-options" rows="2" placeholder="tenant-id-1, tenant-id-2" class="w-full text-xs font-mono border border-slate-200/80 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-slate-700 dark:text-slate-100 placeholder-slate-400 shadow-sm outline-none"></textarea>
          <p class="text-[11px] text-slate-400">Comma-separated tenant IDs to quickly switch context.</p>
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Theme</label>
          <select id="settings-theme" class="w-full text-xs border border-slate-200/80 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 text-slate-700 dark:text-slate-100">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-between gap-2.5 mt-6 pt-4 border-t border-slate-100 dark:border-slate-700">
      <button id="btn-settings-logout" class="border border-rose-200 bg-rose-50 text-rose-700 rounded-xl px-4 py-2 text-xs font-semibold hover:bg-rose-100 transition-colors shadow-sm">
        Log out
      </button>
      <div class="flex items-center gap-2.5">
      <button id="btn-settings-cancel" class="border border-slate-200/80 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-700 hover:border-slate-300 transition-colors shadow-sm">
        Cancel
      </button>
      <button id="btn-settings-save" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-4 py-2 text-xs font-semibold transition-colors shadow-sm shadow-indigo-100">
        Save &amp; Reload
      </button>
      </div>
    </div>

  </div>
</div>
