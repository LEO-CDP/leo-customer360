<!-- 
  =============================================================================
  API CONNECTION SETTINGS MODAL
  =============================================================================
  Features:
  - Backdrop blur overlay for a modern glass/focused effect
  - Rounded-2xl modal card with subtle borders and enhanced shadow
  - Header with integrated settings icon and typography
  - Modernized form inputs with focus states and clean uppercase label styles
  - Polished button styles matching the unified dashboard design system
-->
<div id="settings-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
    
    <!-- Modal Header -->
    <div class="flex items-center gap-3 mb-5 pb-3 border-b border-slate-100">
      <div class="p-2 bg-indigo-50 text-indigo-600 rounded-xl">
        <!-- Settings / Cog Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a6.932 6.932 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.332.183-.582.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-900 tracking-tight">API Connection Settings</h2>
        <p class="text-xs text-slate-400">Configure global base URL and multi-tenant context</p>
      </div>
    </div>

    <!-- Form Fields -->
    <div class="space-y-4">
      <div>
        <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">API Base URL</label>
        <input id="settings-api-base" type="text" placeholder="https://api.example.com" class="w-full text-xs border border-slate-200/80 bg-slate-50/50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-xl px-3.5 py-2.5 text-slate-700 placeholder-slate-400 shadow-sm outline-none" />
      </div>

      <div>
        <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Tenant ID <span class="normal-case text-slate-300 font-normal">(X-Tenant-Id header, dev RLS)</span></label>
        <input id="settings-tenant-id" type="text" placeholder="00000000-0000-0000-0000-000000000000" class="w-full text-xs font-mono border border-slate-200/80 bg-slate-50/50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all rounded-xl px-3.5 py-2.5 text-slate-700 placeholder-slate-400 shadow-sm outline-none" />
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-end gap-2.5 mt-6 pt-4 border-t border-slate-100">
      <button id="btn-settings-cancel" class="border border-slate-200/80 bg-white rounded-xl px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition-colors shadow-sm">
        Cancel
      </button>
      <button id="btn-settings-save" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-4 py-2 text-xs font-semibold transition-colors shadow-sm shadow-indigo-100">
        Save &amp; Reload
      </button>
    </div>

  </div>
</div>
