name: Docs Vector Refresh

# The docs-vector-search index (pgvector on the vDB) is refreshed by the CD
# "docs-search" deploy step, which runs `enrich` ON the box — that is where the
# vDB and the model weights live, so it can't run on a GitHub runner.
#
#   - CODE changes under tools/docs-vector-search/** flow through CI -> CD like any
#     service (built, pushed, deployed + enriched).
#   - DOCS-ONLY changes are path-ignored by CI, so this workflow covers them: on a
#     docs/** change to main it DISPATCHES the CD `docs-index` step — re-index only:
#     ship docs/*.md, re-chunk + re-embed, upsert into pgvector with the image already
#     running (no pull, no restart). enrich is content-hash idempotent, so unchanged
#     docs re-embed nothing.
#   - A push that ALSO changes non-doc files runs CI -> CD, whose docs-search step ships
#     the corpus anyway, so this workflow skips it (two enrich runs would race).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-vector-index.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose index to refresh"
        type: choice
        options: [uat, prod]
        default: uat

permissions:
  contents: read
  actions: write # to dispatch cd.yml

concurrency:
  group: docs-vector-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CD docs-index (re-index only)
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment || 'uat' }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # Same path-ignore list as ci.yml: anything outside it means CI -> CD runs.
            others="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --paginate \
              --jq '.files[].filename' | grep -vE '^(docs|ui-wireframes)/' || true)"
            if [ -n "$others" ]; then
              echo "Push also changes non-doc files — CI -> CD redeploys docs-search with this corpus. Skipping."
              exit 0
            fi
          fi
          echo "Re-indexing docs-vector-search on '$ENVIRONMENT' (docs-only change)."
          # docs-index uses the image the docs container is already running, so image_tag
          # is not used (cd.yml requires the input).
          gh workflow run cd.yml \
            -f environment="$ENVIRONMENT" \
            -f image_tag=latest \
            -f services=docs-index
