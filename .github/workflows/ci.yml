name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'ui-wireframes/**'
      - 'docs/**'
      - 'frontend-admin/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'ui-wireframes/**'
      - 'docs/**'
      - 'frontend-admin/**'

jobs:
  unit-tests:
    name: Run customer360-api unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: customer360-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Make test runner executable
        run: chmod +x run_unit_tests.sh

      - name: Run unit tests
        run: |
          mkdir -p logs
          ./run_unit_tests.sh --junitxml=logs/test-results.xml --tb=short 2>&1 | tee logs/test-output.log

      - name: Upload test logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: customer360-api-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            customer360-api/logs/test-output.log
            customer360-api/logs/test-results.xml
          retention-days: 30

      - name: Publish test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: customer360-api/logs/test-results.xml

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          secure: false
          username: ${{ secrets.BREVO_SMTP_LOGIN }}
          password: ${{ secrets.BREVO_SMTP_KEY }}
          subject: "CI ${{ job.status }}: customer360-api unit tests (run #${{ github.run_number }})"
          to: trieu@leocdp.com
          from: ${{ secrets.BREVO_SENDER_EMAIL }}
          body: |
            Workflow: ${{ github.workflow }}
            Job status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch/ref: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: |
            customer360-api/logs/test-output.log
            customer360-api/logs/test-results.xml