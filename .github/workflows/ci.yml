name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'ui-wireframes/**'
      - 'docs/**'
      - 'frontend-admin/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'ui-wireframes/**'
      - 'docs/**'
      - 'frontend-admin/**'

jobs:
  unit-tests:
    name: Run all unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        # FIX: Ensure this is the absolute latest version. 
        # If v7 still throws the warning, check the actions/checkout repo for a v8+.
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        # FIX: Ensure this is the absolute latest version.
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Make test runner executable
        run: chmod +x run_all_tests.sh

      - name: Run all unit tests
        run: |
          # Create the 'logs' directory so 'tee' has a place to write the file.
          mkdir -p logs
          
          # Run the script and pipe the output
          ./run_all_tests.sh 2>&1 | tee logs/test-output.log

      - name: Upload test logs
        if: always()
        # FIX: Check actions/upload-artifact for the latest tag if the warning persists.
        uses: actions/upload-artifact@v7
        with:
          name: all-unit-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/test-output.log
          retention-days: 30

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          secure: false
          username: ${{ secrets.BREVO_SMTP_LOGIN }}
          password: ${{ secrets.BREVO_SMTP_KEY }}
          subject: "CI ${{ job.status }}: all unit tests (run #${{ github.run_number }})"
          to: trieu@leocdp.com
          from: ${{ secrets.BREVO_SENDER_EMAIL }}
          body: |
            Workflow: ${{ github.workflow }}
            Job status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch/ref: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: |
            logs/test-output.log