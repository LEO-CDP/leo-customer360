name: Telegram CI/CD notify

# Fan-in notifier: every start and finish of the platform's CI/CD workflows is
# forwarded to Telegram. Add new workflows to the `workflows:` list to cover them
# — no edits needed in the workflows themselves.
#
# Required secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

on:
  workflow_run:
    workflows:
      - CI
      - CD
      - Admin (UAT)
      - Docs Site
      - Docs Vector Refresh
    types: [requested, completed]

permissions:
  contents: read

concurrency:
  group: tg-notify-${{ github.event.workflow_run.id }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  notify:
    name: Forward to Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the composite action)
        uses: actions/checkout@v4

      - name: Compose message
        id: msg
        env:
          ACTION: ${{ github.event.action }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_NUM: ${{ github.event.workflow_run.run_number }}
          URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          reason=""
          if [ "$ACTION" = "requested" ]; then
            st="start"; state="started"
          else
            case "$CONCLUSION" in
              success)             st="success"; state="succeeded" ;;
              failure|timed_out)   st="failure"; state="failed" ;;
              cancelled)           st="warning"; state="cancelled" ;;
              skipped)             st="warning"; state="skipped" ;;
              *)                   st="warning"; state="${CONCLUSION:-completed}" ;;
            esac
            # Non-success (and non-start): spell out the reason in the message.
            if [ "$st" != "success" ]; then
              reason="Reason: concluded '${CONCLUSION:-unknown}' (${WF_EVENT} on ${BRANCH}) — open the run for the failing step + logs."
            fi
          fi
          echo "status=${st}" >> "$GITHUB_OUTPUT"
          {
            echo "text<<TG_EOF"
            echo "${WF_NAME} ${state}"
            echo ""
            echo "Repo:    ${REPO}"
            echo "Branch:  ${BRANCH}"
            echo "Trigger: ${WF_EVENT} by ${ACTOR}"
            echo "Run:     #${RUN_NUM}"
            [ -n "$reason" ] && { echo ""; echo "$reason"; }
            echo "${URL}"
            echo "TG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ steps.msg.outputs.status }}
          message: ${{ steps.msg.outputs.text }}
