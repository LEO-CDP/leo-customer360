name: Publish Customer 360 DAO

on:
  workflow_dispatch:
  push:
    tags:
      - "dao-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish DAO package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build customer360-dao

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: customer360-dao/dist/