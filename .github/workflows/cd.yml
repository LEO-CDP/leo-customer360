name: CD

# ---------------------------------------------------------------------------
# Continuous Delivery. Two ways in:
#
# 1. workflow_run (automatic) — fires after CI finishes and deploys only when:
#      • CI concluded successfully, AND
#      • the ref CI ran on is a deploy target:
#          main (any merge/commit)                       -> uat  (pulls :sha-<commit>)
#          vX.Y.Z tag                                    -> prod (pulls :vX.Y.Z)
#    Feature branches, PRs, and failed-CI runs are skipped. Every successful push
#    to main deploys uat automatically (no opt-in marker).
#
# 2. workflow_dispatch (manual) — Actions "Run workflow" form (or `gh workflow
#    run cd.yml -f ...`) to deploy/ROLL BACK any environment to any image tag:
#      environment: uat | prod
#      image_tag:   v1.2.3 | sha-<git>             (immutable tags for rollback)
#      services:    comma list (default: db-schema,sso-realm,api,backend,promotions,frontend,event-api,agent,docs-search)
#                   docs-index = docs-search re-index only (ship docs/*.md + enrich, no pull or
#                   restart) — what docs-vector-index.yml dispatches for docs-only changes.
#    This is the rollback path — pick a previously-built tag and redeploy it.
#
# It deploys by PULLING the image from GHCR — the module scripts run in ghcr
# mode (BUILD_LOCAL unset), so nothing is rebuilt here.
#
# Job graph:
#   select ─┬─► docs-search : docs-search | docs-index          (own VM; no app-schema
#           │                                                    dependency — enrich creates
#           │                                                    its own rag schema)
#           └─► db-schema ─┬─► api box  : sso-realm → api      (same VM as frontend;
#                          │                                    api reads the realm secret
#                          │                                    sso-realm writes)
#                          ├─► frontend : frontend               (same VM; no deploy-time
#                          │                                    dependency on api running —
#                          │                                    the browser calls the API,
#                          │                                    not this container)
#                          ├─► backend  : backend (Dagster)      (own VM)
#                          ├─► vks      : promotions → event-api (VKS cluster)
#                          └─► agent    : agent                  (own VM)
# Groups touch disjoint hosts (or independent containers on the same host), so they run
# in parallel; each runs deploy-all.sh --only <its steps> through the reusable
# cd-deploy-steps.yml. Any unrecognised step named in a manual `services` list joins the
# api-box group (deploy-all keeps its dependency order).
# Note for prod: every job binds the 'prod' Environment, so a reviewer approves db-schema,
# then the parallel groups (one review dialog covers all of them).
#
# Required repo secrets:
#   DEPLOY_SSH_KEY   private key for the deploy user on the VNG Cloud VMs
#   DB_PASSWORD      -> TF_VAR_db_password    (read by the app deploy scripts)
#   REDIS_PASSWORD   -> TF_VAR_redis_password (used by the API cache and the event-api Redis Stream queue; docs-search uses a dedicated no-auth local Redis)
#   DOCS_OPENAI_API_KEY -> docs-vector-search OpenAI embeddings and LLM
#   BREVO_SMTP_PASSWORD -> Brevo SMTP password for uat (email_engine real send + /metadata/smtp); absent => uat email stays mock. prod has no smtp.prod.env so stays mock regardless.
#   LEO_OPENAI_API_KEY  -> customer360-agent LLM_API_KEY (OpenAI via LiteLLM)
#   (var) LEO_OPENAI_MODEL_NAME -> customer360-agent LLM_MODEL (bare name; deploy-agent.sh adds openai/)
#   AGENT_API_TOKEN     -> shared bearer token gating the agent's /plan/* (agent + api both get it)
#   DOCS_INTERNAL_AUTH_SECRET -> shared secret for the customer360-frontend /ai proxy (optional)
#   VSTORAGE_ACCESS_KEY / VSTORAGE_SECRET_KEY -> S3/vStorage remote-state creds AND
#                        TF_VAR_access_key / TF_VAR_secret_key (event-api S3 sink)
#   GHCR_PULL_TOKEN  PAT with read:packages, used as the VKS imagePullSecret. REQUIRED for
#                    the 'event-api' and 'promotions' steps: unlike the vServer path (which pulls inside the
#                    job), Kubernetes stores this and re-reads it on every later image pull,
#                    so the job's own GITHUB_TOKEN would expire and break scale-ups.
#   VKS_KUBECONFIG   full kubeconfig for the GreenNode VKS cluster — REQUIRED by the
#                    'event-api' and 'promotions' steps, which deploy their services as Kubernetes
#                    Deployments (autoscaled pods) instead of onto a vServer. Download it
#                    from https://vks.console.greennode.ai (cluster -> Kubeconfig) and paste
#                    it in whole. Without it those steps fail; the others are unaffected.
# GHCR pulls on the vServers use the built-in GITHUB_TOKEN (packages: read) — those pull
# inside the job, so a short-lived token is fine. The VKS steps are the exception; see
# GHCR_PULL_TOKEN above.
# The 'prod' GitHub Environment should carry required-reviewer protection so a
# release (or manual prod rollback) waits for manual approval.
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [uat, prod]
        required: true
      image_tag:
        description: "Image tag to deploy — immutable only (vX.Y.Z or sha-<git>)"
        type: string
        required: true
      services:
        description: "Comma-separated services to (re)deploy (e.g. db-schema,sso-realm,api,backend,promotions,frontend,event-api,agent,docs-search; docs-index = re-index only)"
        type: string
        default: "db-schema,sso-realm,api,backend,promotions,frontend,event-api,agent,docs-search"
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  # Serialize per target environment (single writer). Automatic main deploys
  # target UAT; release-tag deploys target prod; manual runs use their input.
  # A docs-only re-index (services=docs-index, from docs-vector-index.yml) gets its OWN
  # group: sharing this one let a docs change merged mid-deploy CANCEL the full deploy.
  group: cd-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'uat' || 'prod') }}${{ github.event_name == 'workflow_dispatch' && inputs.services == 'docs-index' && '-docs-index' || '' }}
  # A newer successful CI run must win. Leaving older workflow_run events queued
  # lets GitHub start them later and roll the environment back to an older SHA.
  cancel-in-progress: true

jobs:
  # Decide whether/where/what to deploy — from the finished CI run, or from the
  # manual dispatch inputs.
  select:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      env: ${{ steps.pick.outputs.env }}
      tag: ${{ steps.pick.outputs.tag }}
      services: ${{ steps.pick.outputs.services }}
      schema: ${{ steps.groups.outputs.schema }}
      docs: ${{ steps.groups.outputs.docs }}
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - name: Pick target environment
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          # workflow_run context (branch name, or tag name for tag pushes)
          REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # workflow_dispatch inputs
          IN_ENV: ${{ inputs.environment }}
          IN_TAG: ${{ inputs.image_tag }}
          IN_SERVICES: ${{ inputs.services }}
        run: |
          # sso-realm runs bootstrap-realm.py (idempotent): provisions the realm, the API's
          # admin roles + confidential client before the app steps. deploy-all.sh orders it
          # ahead of api via its STEPS list. Needs KEYCLOAK_ADMIN_PASSWORD in sso/.env (above).
          DEFAULT_SVC="db-schema,sso-realm,api,backend,promotions,frontend,event-api,agent,docs-search"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            svc="${IN_SERVICES:-$DEFAULT_SVC}"
            {
              echo "deploy=true"
              echo "env=$IN_ENV"
              echo "tag=$IN_TAG"
              echo "services=$svc"
            } >> "$GITHUB_OUTPUT"
            echo "→ manual deploy/rollback: env=$IN_ENV tag=$IN_TAG services=$svc"
          else
            if [[ "$REF" == "main" ]]; then
              # workflow_run events can be queued out of order. Skip an older
              # successful CI run once main has advanced; its newer CI run will
              # perform the deployment for the current commit.
              CURRENT_MAIN_SHA="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
              if [[ "$CURRENT_MAIN_SHA" != "$HEAD_SHA" ]]; then
                echo "-> skip stale CI run: head=$HEAD_SHA current-main=$CURRENT_MAIN_SHA"
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Every successful push/merge to main deploys uat automatically (no opt-in marker).
              { echo "deploy=true"; echo "env=uat"; echo "tag=sha-$HEAD_SHA"; echo "services=$DEFAULT_SVC"; } >> "$GITHUB_OUTPUT"
              echo "-> deploy uat (exact CI-built image for $HEAD_SHA)"
            elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              { echo "deploy=true"; echo "env=prod"; echo "tag=$REF"; echo "services=$DEFAULT_SVC"; } >> "$GITHUB_OUTPUT"
              echo "→ deploy prod (tag $REF)"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "→ skip: ref '$REF' is neither main nor a vX.Y.Z tag"
            fi
          fi

      # Split the selected steps into db-schema (runs first) and per-host groups (run in
      # parallel after it). Order inside a group is kept by deploy-all.sh's STEPS list.
      - name: Group steps by target host
        id: groups
        if: steps.pick.outputs.deploy == 'true'
        env:
          SERVICES: ${{ steps.pick.outputs.services }}
        run: |
          schema=""; docs=""; apibox=""; frontend=""; backend=""; vks=""; agent=""
          for s in ${SERVICES//,/ }; do
            case "$s" in
              db-schema)                         schema="db-schema" ;;
              backend)                           backend="backend" ;;
              promotions|event-api|ads|tracking) vks="${vks:+$vks,}$s" ;;
              agent)                             agent="agent" ;;
              docs-search|docs-index)            docs="${docs:+$docs,}$s" ;;
              frontend)                          frontend="frontend" ;;
              *)                                 apibox="${apibox:+$apibox,}$s" ;;
            esac
          done
          groups="$(jq -nc --arg a "$apibox" --arg b "$backend" --arg v "$vks" --arg g "$agent" --arg f "$frontend" \
            '[$a, $b, $v, $g, $f] | map(select(. != ""))')"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "-> docs (starts now): ${docs:-(none)}   first: ${schema:-(none)}   then in parallel: $groups"

  # docs-search has its own VM and creates its own rag schema, so it does not wait for
  # db-schema: it starts right away, alongside it.
  docs-search:
    needs: select
    if: ${{ needs.select.outputs.deploy == 'true' && needs.select.outputs.docs != '' }}
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: ./.github/workflows/cd-deploy-steps.yml
    with:
      environment: ${{ needs.select.outputs.env }}
      image_tag: ${{ needs.select.outputs.tag }}
      steps: ${{ needs.select.outputs.docs }}
    secrets: inherit

  db-schema:
    needs: select
    if: ${{ needs.select.outputs.deploy == 'true' && needs.select.outputs.schema != '' }}
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: ./.github/workflows/cd-deploy-steps.yml
    with:
      environment: ${{ needs.select.outputs.env }}
      image_tag: ${{ needs.select.outputs.tag }}
      steps: db-schema
    secrets: inherit

  deploy:
    needs: [select, db-schema]
    # Run when db-schema succeeded OR was not selected (skipped); never after it failed.
    if: >-
      ${{ !cancelled() && needs.select.outputs.deploy == 'true'
          && needs.select.outputs.groups != '[]' && needs.select.outputs.groups != ''
          && (needs.db-schema.result == 'success' || needs.db-schema.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
      deployments: write   # record each deploy to the GitHub Deployments API (release ledger)
    strategy:
      fail-fast: false     # one host failing must not cancel the others mid-deploy
      matrix:
        steps: ${{ fromJSON(needs.select.outputs.groups) }}
    uses: ./.github/workflows/cd-deploy-steps.yml
    with:
      environment: ${{ needs.select.outputs.env }}
      image_tag: ${{ needs.select.outputs.tag }}
      steps: ${{ matrix.steps }}
    secrets: inherit
