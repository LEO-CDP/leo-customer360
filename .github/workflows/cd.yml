name: CD

# ---------------------------------------------------------------------------
# Continuous Delivery. Two ways in:
#
# 1. workflow_run (automatic) — fires after CI finishes and deploys only when:
#      • CI concluded successfully, AND
#      • the ref CI ran on is a deploy target:
#          main + commit title contains "--deploy-uat"  -> uat  (pulls :latest)
#          vX.Y.Z tag                                    -> prod (pulls :vX.Y.Z)
#    Everything else (main pushes without the marker, feature branches, PRs,
#    failed CI) is skipped. The "--deploy-uat" marker makes uat deploys OPT-IN
#    per commit rather than firing on every push to main.
#
# 2. workflow_dispatch (manual) — Actions "Run workflow" form (or `gh workflow
#    run cd.yml -f ...`) to deploy/ROLL BACK any environment to any image tag:
#      environment: uat | prod
#      image_tag:   v1.2.3 | sha-<git> | latest   (immutable tags for rollback)
#      services:    comma list (default: api,backend,ads,frontend)
#    This is the rollback path — pick a previously-built tag and redeploy it.
#
# It deploys by PULLING the image from GHCR — the module scripts run in ghcr
# mode (BUILD_LOCAL unset), so nothing is rebuilt here.
#
# Required repo secrets:
#   DEPLOY_SSH_KEY   private key for the deploy user on the VNG Cloud VMs
#   DB_PASSWORD      -> TF_VAR_db_password    (read by the app deploy scripts)
#   REDIS_PASSWORD   -> TF_VAR_redis_password (optional; cache stays off if unset)
#   VSTORAGE_ACCESS_KEY / VSTORAGE_SECRET_KEY -> S3/vStorage remote-state creds
# GHCR pulls use the built-in GITHUB_TOKEN (packages: read).
# The 'prod' GitHub Environment should carry required-reviewer protection so a
# release (or manual prod rollback) waits for manual approval.
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [uat, prod]
        required: true
      image_tag:
        description: "Image tag to deploy — use an immutable tag to roll back (vX.Y.Z or sha-<git>); avoid 'latest'"
        type: string
        required: true
      services:
        description: "Comma-separated services to (re)deploy"
        type: string
        default: "api,backend,ads,frontend"
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  # Serialise per environment (single writer). For workflow_run the branch/tag
  # name maps to the env; for a manual run the chosen environment does.
  group: cd-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

jobs:
  # Decide whether/where/what to deploy — from the finished CI run, or from the
  # manual dispatch inputs.
  select:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      env: ${{ steps.pick.outputs.env }}
      tag: ${{ steps.pick.outputs.tag }}
      services: ${{ steps.pick.outputs.services }}
    steps:
      - name: Pick target environment
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          # workflow_run context (branch name, or tag name for tag pushes) + commit msg
          REF: ${{ github.event.workflow_run.head_branch }}
          MSG: ${{ github.event.workflow_run.head_commit.message }}
          # workflow_dispatch inputs
          IN_ENV: ${{ inputs.environment }}
          IN_TAG: ${{ inputs.image_tag }}
          IN_SERVICES: ${{ inputs.services }}
        run: |
          # sso-realm runs bootstrap-realm.py (idempotent): provisions the realm, the API's
          # admin roles + confidential client before the app steps. deploy-all.sh orders it
          # ahead of api via its STEPS list. Needs KEYCLOAK_ADMIN_PASSWORD in sso/.env (above).
          DEFAULT_SVC="sso-realm,api,backend,ads,frontend"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            svc="${IN_SERVICES:-$DEFAULT_SVC}"
            {
              echo "deploy=true"
              echo "env=$IN_ENV"
              echo "tag=$IN_TAG"
              echo "services=$svc"
            } >> "$GITHUB_OUTPUT"
            echo "→ manual deploy/rollback: env=$IN_ENV tag=$IN_TAG services=$svc"
          else
            TITLE="$(printf '%s\n' "$MSG" | head -n1)"
            if [[ "$REF" == "main" ]]; then
              if [[ "$TITLE" == *"--deploy-uat"* ]]; then
                { echo "deploy=true"; echo "env=uat"; echo "tag=latest"; echo "services=$DEFAULT_SVC"; } >> "$GITHUB_OUTPUT"
                echo "→ deploy uat (title opted in: --deploy-uat)"
              else
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "→ skip uat: commit title has no --deploy-uat marker"
              fi
            elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              { echo "deploy=true"; echo "env=prod"; echo "tag=$REF"; echo "services=$DEFAULT_SVC"; } >> "$GITHUB_OUTPUT"
              echo "→ deploy prod (tag $REF)"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "→ skip: ref '$REF' is not main(+--deploy-uat) nor a vX.Y.Z tag"
            fi
          fi

  deploy:
    needs: select
    if: ${{ needs.select.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    # Binds to a GitHub Environment — attach protection rules to 'prod'.
    environment: ${{ needs.select.outputs.env }}
    permissions:
      contents: read
      packages: read
      deployments: write   # record each deploy to the GitHub Deployments API (release ledger)
    env:
      ENVIRONMENT: ${{ needs.select.outputs.env }}
      IMAGE_TAG: ${{ needs.select.outputs.tag }}   # consumed by lib/ghcr.sh resolve_tag
      SERVICES: ${{ needs.select.outputs.services }}
      # vStorage S3 creds for the remote Terraform backend (state read on the runner).
      AWS_ACCESS_KEY_ID: ${{ secrets.VSTORAGE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VSTORAGE_SECRET_KEY }}
    steps:
      - name: Checkout the deploy scripts
        uses: actions/checkout@v7
        with:
          # For an automatic run, use the exact commit CI validated; for a manual
          # run, use the default branch's scripts (the image itself is pinned by tag).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Must be >= the Terraform that wrote the remote state (migrated with
          # 1.14.8); an older Terraform refuses state from a newer version.
          terraform_version: 1.14.8

      - name: Install the deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/c360-api_ed25519
          chmod 600 ~/.ssh/c360-api_ed25519

      # READ-ONLY. The app deploy scripts read the vServer IPs / DB host / redis
      # host from these modules' Terraform OUTPUTS. init connects to the shared
      # S3/vStorage remote backend (creds from the AWS_* env above) so the runner
      # sees the same state operators use. This runs `init` + `output` only — it
      # never `apply`s and never provisions or mutates the vDB, vLB, or vStorage.
      - name: terraform init (read-only — remote state, output resolution only)
        working-directory: deployments
        run: |
          for m in server postgres cache; do
            terraform -chdir="$m" init -input=false >/dev/null
          done

      # SSO client secret for customer360-api. deployments/sso/.env is git-ignored
      # (bootstrap-realm.py writes it locally), so it is ABSENT on the runner — and
      # without KEYCLOAK_CLIENT_SECRET deploy-api.sh treats the SSO config as
      # "incomplete" and downgrades the API to SSO_LOGIN=false, which the frontend
      # then reads from GET /metadata. Recreate the file from the environment secret
      # so the API (and thus the UI) keeps SSO enabled. Set as a REPO secret (matches
      # DB_PASSWORD / DEPLOY_SSH_KEY here); scope it to a GitHub Environment only if the
      # realm secret ever differs between uat and prod (env secret overrides repo).
      - name: Provision Keycloak secrets (deployments/sso/.env)
        working-directory: deployments/sso
        env:
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          # Required by the 'sso-realm' step (bootstrap-realm.py logs in as the KC admin to
          # idempotently provision the realm, roles + confidential client). Add it as a repo/env
          # secret; without it the sso-realm step aborts.
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          umask 077
          : > .env
          if [ -n "$KEYCLOAK_CLIENT_SECRET" ]; then
            printf 'KEYCLOAK_CLIENT_SECRET=%s\n' "$KEYCLOAK_CLIENT_SECRET" >> .env
            echo "sso/.env: KEYCLOAK_CLIENT_SECRET set."
          else
            echo "::warning::KEYCLOAK_CLIENT_SECRET not set for '$ENVIRONMENT' — API will deploy with SSO_LOGIN=false."
          fi
          if [ -n "$KEYCLOAK_ADMIN_PASSWORD" ]; then
            printf 'KEYCLOAK_ADMIN_PASSWORD=%s\n' "$KEYCLOAK_ADMIN_PASSWORD" >> .env
            echo "sso/.env: KEYCLOAK_ADMIN_PASSWORD set (enables the sso-realm bootstrap)."
          else
            echo "::warning::KEYCLOAK_ADMIN_PASSWORD not set for '$ENVIRONMENT' — the sso-realm step will fail; add it as a repo/env secret."
          fi

      # Deploys to the vSERVERS ONLY: pull the image from GHCR and `docker run`
      # over SSH for the selected app containers. `--only` restricts execution to
      # the app steps, so CD NEVER runs the infra Terraform deploy.sh scripts —
      # server (vServer provisioning), storage (vStorage), postgres (vDB), or
      # load_balancer (vLB) are all managed outside this pipeline.
      - name: Deploy app containers to the vServers (pull from GHCR)
        working-directory: deployments
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}
          GH_TOKEN: ${{ github.token }}   # lets lib/record_deploy.sh call `gh api` (Deployments ledger)
        run: |
          # Invoke via `bash` (not ./) — scripts committed from Windows lack the
          # git executable bit, so ./deploy-all.sh would fail with exit 126.
          bash deploy-all.sh "$ENVIRONMENT" --only "$SERVICES" -y
