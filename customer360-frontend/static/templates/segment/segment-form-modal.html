<!-- Segment editor. Rules are stored in json_rules and translated to the
     validated sql_rules fragment before the API request is sent. -->
<div id="segment-form-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl p-6 border border-slate-100 max-h-[92vh] overflow-y-auto">
    <div class="flex items-center justify-between gap-4 mb-5 pb-3 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-50 text-indigo-600 rounded-xl">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" /></svg>
        </div>
        <div>
          <h2 id="segment-form-title" class="text-base font-bold text-slate-900 tracking-tight">Create segment</h2>
          <p class="text-xs text-slate-400 mt-0.5">Build rules against customer360.cdp_profile_attributes</p>
        </div>
      </div>
      <button id="btn-segment-form-close" type="button" class="text-slate-400 hover:text-slate-700" aria-label="Close">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <div id="segment-form-error" class="hidden mb-4 rounded-lg border border-red-200 bg-red-50 text-red-700 text-xs px-3 py-2"></div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
      <div>
        <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Segment name *</label>
        <input id="segment-form-name" type="text" class="w-full text-xs border border-slate-200 bg-slate-50/50 rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" placeholder="High value customers" />
      </div>
      <div>
        <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Segment tag *</label>
        <input id="segment-form-tag" type="text" class="w-full text-xs font-mono border border-slate-200 bg-slate-50/50 rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" placeholder="high_value_customers" />
      </div>
      <div>
        <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Domain</label>
        <select id="segment-form-domain" class="w-full text-xs border border-slate-200 bg-slate-50/50 rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"><option value="all">All domains</option></select>
      </div>
      <div>
        <label class="block text-[11px] text-slate-400 uppercase tracking-wider font-semibold mb-1.5">Description</label>
        <input id="segment-form-description" type="text" class="w-full text-xs border border-slate-200 bg-slate-50/50 rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" placeholder="What defines this audience?" />
      </div>
    </div>

    <div class="rounded-xl border border-slate-200 bg-slate-50/40 p-3 md:p-4">
      <div class="flex items-center justify-between gap-3 mb-3">
        <div>
          <h3 class="text-sm font-bold text-slate-800">Audience rules</h3>
          <p class="text-xs text-slate-400 mt-0.5">Choose attributes and values from the live catalog.</p>
        </div>
        <span id="segment-form-attribute-count" class="text-[11px] text-slate-400"></span>
      </div>
      <div id="segment-query-builder"></div>
      <div id="segment-query-builder-loading" class="py-8 text-center text-xs text-slate-400">Loading segmentable attributes...</div>
    </div>

    <div class="flex items-center justify-end gap-2 mt-5">
      <button id="btn-segment-form-cancel" type="button" class="border border-slate-200 bg-white rounded-xl px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">Cancel</button>
      <button id="btn-segment-form-save" type="button" class="inline-flex items-center gap-1.5 bg-indigo-600 text-white rounded-xl px-4 py-2 text-xs font-semibold hover:bg-indigo-700 shadow-sm"><span id="segment-form-save-label">Create segment</span></button>
    </div>
  </div>
</div>
