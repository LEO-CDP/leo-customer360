<!-- Table Head -->
{{#each columns}}
<th scope="col" class="text-left font-semibold text-xs tracking-wider uppercase text-slate-500 {{#if compactTable}}px-3 py-2.5{{else}}px-6 py-4{{/if}} bg-slate-50/90 border-b border-slate-200/80 select-none {{headerClass}}">{{label}}</th>
{{/each}}
{{#if showActionColumn}}<th scope="col" class="bg-slate-50/90 border-b border-slate-200/80 {{#if compactTable}}px-3 py-2.5 w-24{{else}}px-6 py-4 w-36{{/if}} text-right"><span class="sr-only">Actions</span></th>{{/if}}
