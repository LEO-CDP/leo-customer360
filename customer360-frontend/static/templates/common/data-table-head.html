<!-- Table Head -->
{{#each columns}}
<th scope="col" class="text-left font-semibold text-xs tracking-wider uppercase text-slate-500 {{#if compactTable}}px-3 py-2.5{{else}}px-6 py-4{{/if}} bg-slate-50/90 border-b border-slate-200/80 select-none {{headerClass}}"><span class="inline-flex items-center gap-1.5">{{#if icon}}<i class="bi {{icon}} text-slate-400" aria-hidden="true"></i>{{/if}}{{label}}</span></th>
{{/each}}
{{#if showActionColumn}}<th scope="col" class="bg-slate-50/90 border-b border-slate-200/80 {{#if compactTable}}px-3 py-2.5 w-20{{else}}px-6 py-4 w-36{{/if}} text-right"><span class="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-500"><i class="bi bi-gear text-slate-400" aria-hidden="true"></i>Actions</span></th>{{/if}}
