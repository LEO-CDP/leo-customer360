<!-- 
  =============================================================================
  MASTER PROFILES CARD
  =============================================================================
  - Master Profiles owns the header, filters, table, and pagination.
  - profile-list-view.js binds the table via C360.DataTableView.
  =============================================================================
-->
<div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col h-full overflow-hidden">

  <!-- Master Profiles Content -->
  <div class="w-full flex-1 min-w-0 min-h-0 flex flex-col bg-slate-50/30">

    <!-- ===================== MASTER PROFILES PANEL ===================== -->
    <div id="master-profiles-panel" class="flex-1 min-w-0 min-h-0 flex flex-col">

      <!-- Header & Filters Section -->
      <div class="p-4 md:p-6 border-b border-slate-200 bg-white flex flex-col gap-5 shrink-0">

        <div id="master-profiles-header" class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
          <div class="flex items-center gap-3 min-w-0">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 ring-1 ring-indigo-100">
              <i class="bi bi-people text-lg leading-none" aria-hidden="true"></i>
            </div>
            <div class="min-w-0">
              <div class="text-[10px] font-bold uppercase tracking-[0.16em] text-indigo-500">Customer 360</div>
              <h1 class="truncate text-xl font-bold tracking-tight text-slate-900">Master Profiles</h1>
            </div>
          </div>

          <div class="relative w-full xl:max-w-[28rem]">
            <label for="search-input" class="sr-only">Search master profiles</label>
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i class="bi bi-search text-sm leading-none" aria-hidden="true"></i>
            </span>
            <input
              id="search-input"
              type="search"
              name="profile_search"
              placeholder="Search name, persona, email, phone..."
              autocomplete="off" autocorrect="off" spellcheck="false"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 py-3 pl-10 pr-11 text-sm text-slate-700 shadow-sm outline-none transition-all placeholder:text-slate-400 hover:bg-white focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/20"
            />
            <button id="clear-profile-search" type="button" class="hidden absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" title="Clear profile search" aria-label="Clear profile search">
              <i class="bi bi-x-lg text-sm leading-none" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="grid gap-4 2xl:grid-cols-12">
          <fieldset class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 2xl:col-span-4">
            <legend class="px-1 text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Date range</legend>
            <div class="grid grid-cols-2 gap-3">
              <label for="profile-from-date" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">From</span>
                <input id="profile-from-date" type="date" title="Filter by last activity or profile update date" class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
              </label>

              <label for="profile-to-date" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">To</span>
                <input id="profile-to-date" type="date" title="Filter by last activity or profile update date" class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
              </label>
            </div>
          </fieldset>

          <fieldset class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 2xl:col-span-8">
            <legend class="px-1 text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Profile scope</legend>
            <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
              <label for="domain-filter" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Domain</span>
                <select id="domain-filter" class="w-full min-w-0 cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" title="Filter by business domain">
                  <option value="">All domains</option>
                </select>
              </label>

              <label for="data-source-filter" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Data source</span>
                <select id="data-source-filter" class="w-full min-w-0 cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" title="Filter by data source">
                  <option value="">All data sources</option>
                </select>
              </label>

              <label for="linked-raw-profile-count-input" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Linked raw profiles</span>
                <span class="relative block">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
                  </svg>
                  <input id="linked-raw-profile-count-input" type="number" min="0" placeholder="Minimum count" title="Minimum Linked Raw Profiles" class="w-full min-w-0 rounded-lg border border-slate-300 bg-white py-2.5 pl-9 pr-3 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all placeholder:text-slate-400 hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
                </span>
              </label>
            </div>
          </fieldset>

          <fieldset class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 2xl:col-span-5">
            <legend class="px-1 text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Identity signals</legend>
            <div class="grid gap-3 sm:grid-cols-2">
              <label for="anonymous-id-filter" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Anonymous ID</span>
                <input id="anonymous-id-filter" type="search" name="anonymous_id" maxlength="256" placeholder="Search anonymous ID" autocomplete="off" autocorrect="off" spellcheck="false" class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all placeholder:text-slate-400 hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
              </label>

              <label for="device-fingerprint-filter" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Device fingerprint</span>
                <input id="device-fingerprint-filter" type="search" name="device_fingerprint" maxlength="256" placeholder="Search fingerprint" autocomplete="off" autocorrect="off" spellcheck="false" class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all placeholder:text-slate-400 hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
              </label>
            </div>
          </fieldset>

          <fieldset class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 2xl:col-span-7">
            <legend class="px-1 text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Customer segmentation</legend>
            <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
              <label for="lifecycle-filter" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Lifecycle</span>
                <select id="lifecycle-filter" class="w-full min-w-0 cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" title="Filter by customer lifecycle stage">
                  <option value="">All lifecycle stages</option>
                  <option value="prospect">Prospect</option>
                  <option value="lead">Lead</option>
                  <option value="customer">Customer</option>
                  <option value="vip">VIP</option>
                  <option value="dormant">Dormant</option>
                  <option value="churn_risk">Churn risk</option>
                </select>
              </label>

              <label for="tier-filter" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Value tier</span>
                <select id="tier-filter" class="w-full min-w-0 cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" title="Filter by customer lifetime value tier">
                  <option value="">All value tiers</option>
                  <option value="low">Low Value</option>
                  <option value="medium">Medium Value</option>
                  <option value="high">High Value</option>
                </select>
              </label>

              <label for="churn-risk-filter" class="min-w-0 text-[11px] font-semibold text-slate-500">
                <span class="mb-1.5 block">Churn risk</span>
                <select id="churn-risk-filter" class="w-full min-w-0 cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm font-normal text-slate-700 shadow-sm outline-none transition-all hover:bg-slate-50 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" title="Filter by churn risk level">
                  <option value="">All churn risks</option>
                  <option value="low">Low Risk</option>
                  <option value="medium">Medium Risk</option>
                  <option value="high">High Risk</option>
                  <option value="critical">Critical Risk</option>
                </select>
              </label>
            </div>
          </fieldset>
        </div>
      </div>

      <!-- Table Container (Flex-1 ensures it pushes footer down if content is small) -->
      <div class="overflow-x-auto flex-1 bg-white relative min-h-[300px]">
        <table class="w-full text-sm text-left whitespace-nowrap">
          <thead id="profiles-thead" class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider font-bold border-b border-slate-200 sticky top-0 z-10">
            <!-- 
              Example Injection format for TH:
              <th class="px-6 py-3">Profile ID</th> 
            -->
          </thead>
          <!-- 
            Example Injection format for TBODY TR:
            <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-100 last:border-none">...</tr>
          -->
          <tbody id="profiles-tbody" class="divide-y divide-slate-100"></tbody>
        </table>

        <!-- Loading State (Overlay or Inline) -->
        <div id="list-loading" class="absolute inset-0 z-20 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center p-12">
          <svg class="animate-spin h-8 w-8 text-indigo-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-sm font-medium text-slate-500">Loading profiles...</span>
        </div>

        <!-- Empty State -->
        <div id="list-empty" class="hidden absolute inset-0 z-10 flex flex-col items-center justify-center p-12 text-center bg-white">
          <div class="w-16 h-16 mb-4 rounded-full bg-slate-50 flex items-center justify-center text-slate-300">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v16.5c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9zm3.75 11.625a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
            </svg>
          </div>
          <div class="font-bold text-slate-700 text-base">No profiles matched your filters</div>
          <p class="text-sm text-slate-500 mt-1 max-w-sm">Try adjusting your search query, domain, or filter criteria to find what you're looking for.</p>
          <button type="button" onclick="document.getElementById('search-input').value=''; document.getElementById('search-input').focus();" class="mt-4 text-sm font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">
            Clear search
          </button>
        </div>
      </div>

      <!-- Footer Pagination / Counts -->
      <div class="p-4 px-6 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-500 bg-slate-50 shrink-0">
        <span id="list-count-label" class="font-medium text-slate-600">Showing <span class="font-bold text-slate-900">0</span> results</span>

        <div class="flex items-center gap-3">
          <button
            id="btn-page-prev"
            type="button"
            class="border border-slate-300 bg-white rounded-lg px-4 py-2 font-semibold text-slate-700 hover:bg-slate-50 hover:border-slate-400 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-slate-300">
            Previous
          </button>

          <span id="list-page-label" class="min-w-[5rem] text-center font-medium text-slate-600">Page 1</span>

          <button
            id="btn-page-next"
            type="button"
            class="border border-slate-300 bg-white rounded-lg px-4 py-2 font-semibold text-slate-700 hover:bg-slate-50 hover:border-slate-400 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-slate-300">
            Next
          </button>

          <button id="btn-load-more" class="hidden" aria-hidden="true" tabindex="-1" type="button">Load more</button>
        </div>
      </div>
    </div>



  </div>

</div>
