<!-- 
  =============================================================================
  PERSONALIZED ITEMS LIST TEMPLATE
  =============================================================================
  Features:
  - Clean card layout for each item with subtle background and hover transition
  - Thumbnail image with border and shadow protection
  - Structured typography with item type badge, title, and summary
  - Refined footer with publication timestamp and styled CTA button
  - Polished empty state
-->
{{#if hasItems}}
  <div class="space-y-3">
    {{#each items}}
    <div class="flex gap-4 p-3.5 bg-slate-50/50 hover:bg-slate-50 rounded-xl border border-slate-100/80 transition-all group">
      
      <!-- Optional Thumbnail Image -->
      {{#if image_url}}
      <img src="{{image_url}}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0 border border-slate-200/60 shadow-sm" onerror="this.style.display='none'" />
      {{/if}}
      
      <!-- Content Body -->
      <div class="flex-1 min-w-0 flex flex-col justify-between">
        <div>
          <!-- Item Type Label -->
          <div class="text-[11px] font-semibold text-indigo-600 uppercase tracking-wider mb-0.5">{{item_type}}</div>
          
          <!-- Title -->
          <div class="text-sm font-semibold text-slate-800 line-clamp-2 group-hover:text-indigo-600 transition-colors">{{title}}</div>
          
          <!-- Summary -->
          {{#if summary}}
          <div class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">{{summary}}</div>
          {{/if}}
        </div>

        <!-- Footer: Published Date & Call to Action -->
        <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100/80">
          <span class="text-[11px] text-slate-400 font-medium">{{publishedLabel}}</span>
          
          {{#if cta_url}}
          <a href="{{cta_url}}" target="_blank" rel="noopener" class="text-xs font-semibold text-indigo-600 bg-white border border-indigo-200/80 hover:bg-indigo-50 hover:border-indigo-300 rounded-lg px-3 py-1 transition-all shadow-sm flex items-center gap-1">
            <span>{{ctaLabelOrDefault}}</span>
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
          </a>
          {{/if}}
        </div>
      </div>

    </div>
    {{/each}}
  </div>
{{else}}
  <!-- Refined Empty State -->
  <div class="flex items-center justify-center gap-2 px-3 py-6 w-full rounded-xl border border-dashed border-slate-200 bg-slate-50 text-slate-400 text-sm italic text-center">
    No personalized items available for this profile yet.
  </div>
{{/if}}
