# docs-vector-search — LOCAL DEVELOPMENT only. 1 CPU / 2 GB RAM.
#
# Local models are the default (fastembed + Qwen GGUF); OpenAI-compatible
# embeddings/chat are opt-in through the provider environment variables. Vectors
# live in pgvector (point PG_* in .env at any pgvector Postgres).
# The container SERVES only; build the index first with the selected profile:
#   docker compose --profile cpu run --rm docs-vector-search python -m src.enrich
#   docker compose --profile gpu run --rm docs-vector-search-gpu python -m src.enrich
#
# The vServer deployment is NOT this file — it is deployments/server/deploy-docs-search.sh
# (pulls the CI-built GHCR image, runs enrich on the box, serves). Model weights persist in
# a host-mounted ./models dir.

networks:
  customer360-network:
    name: customer360-network
    external: true

x-docs-vector-search: &docs-vector-search
  build:
    context: .
  image: leo-docs-vector-search:${IMAGE_TAG:-latest}
  restart: unless-stopped
  networks:
    - customer360-network
  env_file:
    - .env
  environment:
    CORPUS_DIR: /app/corpus
    MODELS_DIR: /app/models
    DOCS_EMBEDDING_PROVIDER: ${DOCS_EMBEDDING_PROVIDER:-${EMBED_PROVIDER:-local}}
    DOCS_EMBEDDING_MODEL: ${DOCS_EMBEDDING_MODEL:-${EMBED_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}}
    DOCS_EMBEDDING_DIMENSIONS: ${DOCS_EMBEDDING_DIMENSIONS:-${EMBED_DIM:-384}}
    DOCS_RERANK_ENABLED: ${DOCS_RERANK_ENABLED:-${RERANK_ENABLED:-true}}
    DOCS_RERANK_MODEL: ${DOCS_RERANK_MODEL:-${RERANK_MODEL:-BAAI/bge-reranker-base}}
    DOCS_OPENAI_EMBEDDING_MODEL: ${DOCS_OPENAI_EMBEDDING_MODEL:-${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}}
    DOCS_OPENAI_EMBEDDING_DIMENSIONS: ${DOCS_OPENAI_EMBEDDING_DIMENSIONS:-${OPENAI_EMBEDDING_DIMENSIONS:-384}}
    DOCS_LLM_PROVIDER: ${DOCS_LLM_PROVIDER:-${LLM_PROVIDER:-local}}
    DOCS_LLM_MODEL: ${DOCS_LLM_MODEL:-${OPENAI_CHAT_MODEL:-${LEO_OPENAI_MODEL_NAME:-gpt-5.6-luna}}}
    DOCS_OPENAI_API_KEY: ${DOCS_OPENAI_API_KEY:-${OPENAI_API_KEY:-${LEO_OPENAI_API_KEY:-}}}
    DOCS_OPENAI_BASE_URL: ${DOCS_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-${LEO_OPENAI_BASE_URL:-https://api.openai.com/v1}}}
    DOCS_LOCAL_MODEL_PATH: ${DOCS_LOCAL_MODEL_PATH:-${QWEN_MODEL_PATH:-/app/models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf}}
    OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-120}
    LLAMA_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:--1}
  command: ["uvicorn", "src.server:app", "--host", "0.0.0.0", "--port", "8000"]
  ports:
    - "${API_PORT:-8080}:8000"
  volumes:
    - ../../docs:/app/corpus:ro
    - ${MODELS_DIR_HOST:-./models}:/app/models
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 4g
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  docs-vector-search:
    <<: *docs-vector-search
    profiles: ["cpu"]
    container_name: ${CONTAINER_NAME:-docs-vector-search}

  docs-vector-search-gpu:
    <<: *docs-vector-search
    profiles: ["gpu"]
    container_name: ${CONTAINER_NAME:-docs-vector-search}
    gpus: all
