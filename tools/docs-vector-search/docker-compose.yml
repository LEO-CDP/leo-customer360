# docs-vector-search — LOCAL DEVELOPMENT only. 1 CPU / 2 GB RAM.
#
# OpenAI is the default; Gemini and local fastembed/Qwen are selected independently
# through the provider environment variables. Vectors
# live in pgvector (point PG_* in .env at any pgvector Postgres).
# The container SERVES only; build the index first with the selected profile:
#   docker compose --profile cpu run --rm docs-vector-search python -m src.enrich
#   docker compose --profile gpu run --rm docs-vector-search-gpu python -m src.enrich
#
# The vServer deployment is NOT this file — it is deployments/server/deploy-docs-search.sh
# (pulls the CI-built GHCR image, runs enrich on the box, serves). Model weights persist in
# a host-mounted ./models dir.

networks:
  customer360-network:
    name: customer360-network
    external: true

x-docs-vector-search: &docs-vector-search
  build:
    context: .
    target: ${DOCS_IMAGE_TARGET:-hosted}
  image: leo-docs-vector-search:${IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    docs-rate-limit-redis:
      condition: service_healthy
  networks:
    - customer360-network
  env_file:
    - .env
  environment:
    CORPUS_DIR: /app/corpus
    MODELS_DIR: /app/models
    DOCS_EMBEDDING_PROVIDER: ${DOCS_EMBEDDING_PROVIDER:-openai}
    DOCS_RERANK_ENABLED: ${DOCS_RERANK_ENABLED:-${RERANK_ENABLED:-true}}
    DOCS_RERANK_PROVIDER: ${DOCS_RERANK_PROVIDER:-openai}
    DOCS_RERANK_MODEL: ${DOCS_RERANK_MODEL:-${RERANK_MODEL:-BAAI/bge-reranker-base}}
    DOCS_OPENAI_RERANK_MODEL: ${DOCS_OPENAI_RERANK_MODEL:-gpt-4o-mini}
    DOCS_RERANK_OPENAI_FALLBACK: ${DOCS_RERANK_OPENAI_FALLBACK:-vector}
    DOCS_LLM_PROVIDER: ${DOCS_LLM_PROVIDER:-openai}
    DOCS_LLM_MAX_OUTPUT_TOKENS: ${DOCS_LLM_MAX_OUTPUT_TOKENS:-256}
    DOCS_OPENAI_API_KEY: ${DOCS_OPENAI_API_KEY:-}
    DOCS_OPENAI_API_BASE_URL: ${DOCS_OPENAI_API_BASE_URL:-https://api.openai.com/v1}
    DOCS_OPENAI_REQUEST_TIMEOUT_SECONDS: ${DOCS_OPENAI_REQUEST_TIMEOUT_SECONDS:-120}
    DOCS_OPENAI_RERANK_TIMEOUT_SECONDS: ${DOCS_OPENAI_RERANK_TIMEOUT_SECONDS:-8}
    DOCS_OPENAI_EMBEDDING_MODEL: ${DOCS_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    DOCS_OPENAI_EMBEDDING_DIMENSIONS: ${DOCS_OPENAI_EMBEDDING_DIMENSIONS:-384}
    DOCS_OPENAI_LLM_MODEL: ${DOCS_OPENAI_LLM_MODEL:-gpt-5.6-luna}
    DOCS_GEMINI_API_KEY: ${DOCS_GEMINI_API_KEY:-}
    DOCS_GEMINI_API_BASE_URL: ${DOCS_GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
    DOCS_GEMINI_REQUEST_TIMEOUT_SECONDS: ${DOCS_GEMINI_REQUEST_TIMEOUT_SECONDS:-120}
    DOCS_GEMINI_EMBEDDING_MODEL: ${DOCS_GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
    DOCS_GEMINI_EMBEDDING_DIMENSIONS: ${DOCS_GEMINI_EMBEDDING_DIMENSIONS:-384}
    DOCS_GEMINI_LLM_MODEL: ${DOCS_GEMINI_LLM_MODEL:-gemini-2.5-flash}
    DOCS_LOCAL_EMBEDDING_MODEL: ${DOCS_LOCAL_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    DOCS_LOCAL_EMBEDDING_DIMENSIONS: ${DOCS_LOCAL_EMBEDDING_DIMENSIONS:-384}
    DOCS_LOCAL_LLM_MODEL_PATH: ${DOCS_LOCAL_LLM_MODEL_PATH:-/app/models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf}
    DOCS_LOCAL_LLM_CONTEXT_TOKENS: ${DOCS_LOCAL_LLM_CONTEXT_TOKENS:-2048}
    DOCS_LOCAL_LLM_THREADS: ${DOCS_LOCAL_LLM_THREADS:-2}
    DOCS_LOCAL_LLM_BATCH_SIZE: ${DOCS_LOCAL_LLM_BATCH_SIZE:-512}
    DOCS_LOCAL_LLM_GPU_LAYERS: ${DOCS_LOCAL_LLM_GPU_LAYERS:--1}
    DOCS_REDIS_HOST: ${DOCS_REDIS_HOST:-docs-rate-limit-redis}
    DOCS_REDIS_PORT: ${DOCS_REDIS_PORT:-6580}
    DOCS_REDIS_DB: ${DOCS_REDIS_DB:-0}
    DOCS_REDIS_PASSWORD: ${DOCS_REDIS_PASSWORD:-}
    DOCS_REDIS_CONNECT_TIMEOUT_SECONDS: ${DOCS_REDIS_CONNECT_TIMEOUT_SECONDS:-1}
    DOCS_REDIS_SOCKET_TIMEOUT_SECONDS: ${DOCS_REDIS_SOCKET_TIMEOUT_SECONDS:-1}
  command: ["uvicorn", "src.server:app", "--host", "0.0.0.0", "--port", "8001"]
  ports:
    - "${API_PORT:-8001}:8001"
  volumes:
    - ../../docs:/app/corpus:ro
    - ${MODELS_DIR_HOST:-./models}:/app/models
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 4g
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  docs-rate-limit-redis:
    image: redis:7-alpine
    container_name: ${DOCS_REDIS_CONTAINER_NAME:-docs-rate-limit-redis}
    restart: unless-stopped
    networks:
      - customer360-network
    command:
      - redis-server
      - --port
      - "${DOCS_REDIS_PORT:-6580}"
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${DOCS_REDIS_PORT:-6580} ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docs-vector-search:
    <<: *docs-vector-search
    profiles: ["cpu"]
    container_name: ${CONTAINER_NAME:-docs-vector-search}

  docs-vector-search-gpu:
    <<: *docs-vector-search
    profiles: ["gpu"]
    container_name: ${GPU_CONTAINER_NAME:-docs-vector-search-gpu}
    gpus: all
