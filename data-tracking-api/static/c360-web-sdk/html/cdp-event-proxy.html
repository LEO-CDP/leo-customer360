<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--

        By Trieu Nguyen (Thomas)

    <!-- FingerprintJS2 must be loaded before leo.observer.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs2/2.1.5/fingerprint2.min.js"
        crossorigin="anonymous">
        </script>
</head>

<body>
    <div id="leoproxy"></div>

    <script>
        (function () {
            'use strict';

            // ============================================================
            // GLOBAL CONFIG
            // ============================================================

            var ROOT_DOMAIN = '';
            var PARENT_ORIGIN = '';

            var INJECTED_VISITOR_ID = false;

            var OBSERVE_WITH_FINGERPRINT = true;

            var LEO_LOG_URL = '';
            var PREFIX_EVENT_TRACKING_URL = '';
            var PREFIX_SESSION_INIT_URL = '';
            var PREFIX_UPDATE_PROFILE_URL = '';
            var PREFIX_EVENT_VIEW_URL = '';
            var PREFIX_EVENT_ACTION_URL = '';
            var PREFIX_EVENT_CONVERSION_URL = '';
            var PREFIX_EVENT_FEEDBACK_URL = '';

            var OBSERVER_SCRIPT_LOADED = false;
            var OBSERVER_READY = false;

            var queueTracking = [];
            var queueUpdating = [];

            var synchVisitorCall = false;
            var queueScheduled = false;

            // ============================================================
            // PARSE HASH CONFIG
            // ============================================================

            function parseConfig() {
                var hash = window.location.hash || '';

                if (!hash || hash.length <= 1) {
                    console.error('[LeoProxy] ROOT_DOMAIN is empty in hash');
                    return false;
                }

                var raw = hash.substring(1);

                /*
                 * Expected:
                 * #ROOT_DOMAIN_PARENT_ORIGIN
                 * Or:
                 * #ROOT_DOMAIN_PARENT_ORIGIN_VISITOR_ID
                 */

                var toks = raw.split('_');

                if (toks.length < 2) {
                    console.error('[LeoProxy] Invalid configuration hash:', raw);
                    return false;
                }

                ROOT_DOMAIN = toks[0];
                PARENT_ORIGIN = toks[1];

                try {
                    PARENT_ORIGIN = decodeURIComponent(PARENT_ORIGIN);
                } catch(e) {}
                PARENT_ORIGIN = PARENT_ORIGIN.replace(/\/+$/, '');

                if (toks.length >= 3) {
                    var injectedVisitorId = toks.slice(2).join('_');
                    try {
                        injectedVisitorId = decodeURIComponent(injectedVisitorId);
                    } catch(e) {}

                    if (
                        typeof injectedVisitorId === 'string' &&
                        injectedVisitorId.length > 5
                    ) {
                        INJECTED_VISITOR_ID = injectedVisitorId;
                    }
                }

                ROOT_DOMAIN = ROOT_DOMAIN.replace(/\/+$/, '');
                var protocol = location.protocol === 'http:' ? 'http:' : 'https:';
                if (ROOT_DOMAIN.indexOf('http://') === 0 || ROOT_DOMAIN.indexOf('https://') === 0) {
                    LEO_LOG_URL = ROOT_DOMAIN;
                    ROOT_DOMAIN = ROOT_DOMAIN.replace(/^https?:\/\//, '');
                } else {
                    LEO_LOG_URL = protocol + '//' + ROOT_DOMAIN;
                }

                // Official LeoCDP v1.0 tracking logs API endpoint
                PREFIX_EVENT_TRACKING_URL = LEO_LOG_URL + '/data/api/v1/tracking/logs';
                PREFIX_SESSION_INIT_URL = PREFIX_EVENT_TRACKING_URL;
                PREFIX_UPDATE_PROFILE_URL = PREFIX_EVENT_TRACKING_URL;
                PREFIX_EVENT_VIEW_URL = PREFIX_EVENT_TRACKING_URL;
                PREFIX_EVENT_ACTION_URL = PREFIX_EVENT_TRACKING_URL;
                PREFIX_EVENT_CONVERSION_URL = PREFIX_EVENT_TRACKING_URL;
                PREFIX_EVENT_FEEDBACK_URL = PREFIX_EVENT_TRACKING_URL;

                console.info('[LeoProxy] ROOT_DOMAIN =', ROOT_DOMAIN);
                console.info('[LeoProxy] PARENT_ORIGIN =', PARENT_ORIGIN);
                console.info('[LeoProxy] TRACKING_ENDPOINT =', PREFIX_EVENT_TRACKING_URL);

                if (INJECTED_VISITOR_ID) {
                    console.info('[LeoProxy] Cross-domain INJECTED_VISITOR_ID detected:', INJECTED_VISITOR_ID);
                }

                return true;
            }

            // ============================================================
            // EVENT BINDING
            // ============================================================

            function bindEvent(element, eventName, eventHandler) {
                if (!element) {
                    return;
                }

                if (element.addEventListener) {
                    element.addEventListener(
                        eventName,
                        eventHandler,
                        false
                    );
                } else if (element.attachEvent) {
                    element.attachEvent(
                        'on' + eventName,
                        eventHandler
                    );
                }
            }

            // ============================================================
            // SEND MESSAGE TO PARENT
            // ============================================================

            function sendMessage(message) {
                if (!window.parent || window.parent === window) {
                    return;
                }

                /*
                 * Use configured parent origin whenever possible.
                 * '*' is only a fallback for backwards compatibility.
                 */
                var targetOrigin =
                    PARENT_ORIGIN || '*';

                try {
                    window.parent.postMessage(
                        message,
                        targetOrigin
                    );
                } catch (error) {
                    console.error(
                        '[LeoProxy] postMessage failed:',
                        error
                    );
                }
            }

            // ============================================================
            // PARSE INCOMING MESSAGE
            // ============================================================

            function normalizeMessage(data) {
                if (data === null || typeof data === 'undefined') {
                    return null;
                }

                /*
                 * postMessage can send:
                 *
                 *   string
                 *   object
                 */

                if (typeof data === 'object') {
                    return data;
                }

                if (typeof data === 'string') {
                    /*
                     * Ignore ordinary strings that are not JSON.
                     */
                    try {
                        return JSON.parse(data);
                    } catch (error) {
                        return null;
                    }
                }

                return null;
            }

            // ============================================================
            // VALIDATE MESSAGE ORIGIN
            // ============================================================

            function isAllowedMessage(event) {
                if (!event) {
                    return false;
                }

                /*
                 * Always make sure the message actually came from
                 * the parent window.
                 */
                if (event.source !== window.parent) {
                    console.warn(
                        '[LeoProxy] Ignored message from non-parent source'
                    );

                    return false;
                }

                /*
                 * If we know the parent origin, enforce it.
                 */
                if (
                    PARENT_ORIGIN &&
                    PARENT_ORIGIN !== '*' &&
                    event.origin !== PARENT_ORIGIN
                ) {
                    console.warn(
                        '[LeoProxy] Ignored message from unexpected origin:',
                        event.origin
                    );

                    return false;
                }

                return true;
            }

            // ============================================================
            // OBSERVER ACCESS
            // ============================================================

            function observerAvailable() {
                return (
                    !!window.LeoEventObserver
                );
            }

            function observerReadyForTracking() {
                return (
                    observerAvailable() &&
                    typeof window.LeoEventObserver.doTracking === 'function'
                );
            }

            function observerReadyForProfile() {
                return (
                    observerAvailable() &&
                    typeof window.LeoEventObserver.updateProfile === 'function'
                );
            }

            // ============================================================
            // QUEUE PROCESSING
            // ============================================================

            function processQueue() {
                queueScheduled = false;

                /*
                 * Tracking events
                 */
                while (
                    queueTracking.length &&
                    observerReadyForTracking()
                ) {
                    var trackingData =
                        queueTracking.shift();

                    try {
                        window.LeoEventObserver.doTracking(
                            trackingData.eventType,
                            trackingData.params
                        );
                    } catch (error) {
                        console.error(
                            '[LeoProxy] doTracking failed:',
                            error
                        );
                    }
                }

                /*
                 * Profile updates
                 */
                while (
                    queueUpdating.length &&
                    observerReadyForProfile()
                ) {
                    var profileData =
                        queueUpdating.shift();

                    try {
                        window.LeoEventObserver.updateProfile(
                            profileData.params
                        );
                    } catch (error) {
                        console.error(
                            '[LeoProxy] updateProfile failed:',
                            error
                        );
                    }
                }

                /*
                 * Synchronize visitor ID back to the parent.
                 */
                if (
                    synchVisitorCall !== false &&
                    observerAvailable() &&
                    typeof window.LeoEventObserver.visitorId !== 'undefined'
                ) {
                    sendMessage(
                        'synchLeoVisitorId-' +
                        window.LeoEventObserver.visitorId
                    );

                    synchVisitorCall = false;
                }

                /*
                 * If the observer is not ready yet, don't lose queued calls.
                 * They will be flushed again once the observer is ready.
                 */
            }

            function scheduleQueueFlush() {
                if (queueScheduled) {
                    return;
                }

                queueScheduled = true;

                setTimeout(
                    processQueue,
                    0
                );
            }

            // ============================================================
            // HANDLE CALL FROM PARENT
            // ============================================================

            function proxyCallHandler(data) {
                if (!data || typeof data !== 'object') {
                    return;
                }

                switch (data.call) {

                    case 'doTracking':

                        if (
                            data.eventType &&
                            data.params
                        ) {
                            queueTracking.push(data);
                            scheduleQueueFlush();
                        }

                        break;

                    case 'getContextSession':

                        if (
                            data.params &&
                            observerAvailable() &&
                            typeof window.LeoEventObserver.getContextSession === 'function'
                        ) {
                            try {
                                window.LeoEventObserver.getContextSession(
                                    data.params
                                );
                            } catch (error) {
                                console.error(
                                    '[LeoProxy] getContextSession failed:',
                                    error
                                );
                            }
                        }

                        break;

                    case 'updateProfile':

                        if (data.params) {
                            queueUpdating.push(data);
                            scheduleQueueFlush();
                        }

                        break;

                    case 'synchLeoVisitorId':

                        synchVisitorCall = data;
                        scheduleQueueFlush();

                        break;

                    case 'getPersonalization':

                        if (
                            observerAvailable() &&
                            typeof window.LeoEventObserver.getPersonalization === 'function'
                        ) {
                            try {
                                window.LeoEventObserver.getPersonalization(
                                    data.slotId,
                                    data.params,
                                    function (result) {
                                        sendMessage({
                                            event: 'leoPersonalization',
                                            slotId: data.slotId,
                                            data: result
                                        });
                                    }
                                );
                            } catch (error) {
                                console.error('[LeoProxy] getPersonalization failed:', error);
                            }
                        }

                        break;

                    default:

                        console.debug(
                            '[LeoProxy] Unknown call:',
                            data.call
                        );

                        break;
                }
            }

            // ============================================================
            // MESSAGE LISTENER
            // ============================================================

            bindEvent(
                window,
                'message',
                function (event) {

                    if (!isAllowedMessage(event)) {
                        return;
                    }

                    var json =
                        normalizeMessage(event.data);

                    if (!json) {
                        return;
                    }

                    if (
                        typeof json.call === 'string'
                    ) {
                        proxyCallHandler(json);
                    }
                }
            );

            // ============================================================
            // SCRIPT LOADER
            // ============================================================

            function loadScript(src, options) {

                options =
                    options || {};

                var callback =
                    options.callback || function () { };

                var onError =
                    options.onError || function () { };

                var timeout =
                    typeof options.timeout === 'number'
                        ? options.timeout
                        : 15000;

                var script =
                    document.createElement('script');

                var completed = false;

                script.type = 'text/javascript';
                script.src = src;

                /*
                 * Do not force async execution here.
                 *
                 * We explicitly control when the script is inserted,
                 * and we need a deterministic load callback.
                 */
                script.async = false;

                function finishSuccess() {

                    if (completed) {
                        return;
                    }

                    completed = true;

                    clearTimeout(timer);

                    callback(script);
                }

                function finishError(error) {

                    if (completed) {
                        return;
                    }

                    completed = true;

                    clearTimeout(timer);

                    onError(
                        error || new Error(
                            'Failed to load ' + src
                        )
                    );
                }

                script.onload =
                    finishSuccess;

                script.onreadystatechange =
                    function () {

                        if (
                            !completed &&
                            (
                                script.readyState === 'loaded' ||
                                script.readyState === 'complete'
                            )
                        ) {
                            finishSuccess();
                        }
                    };

                script.onerror =
                    finishError;

                var container =
                    document.getElementById(
                        'leoproxy'
                    );

                if (!container) {
                    finishError(
                        new Error(
                            '#leoproxy element not found'
                        )
                    );

                    return;
                }

                container.appendChild(script);

                var timer =
                    setTimeout(
                        function () {

                            finishError(
                                new Error(
                                    'Script load timeout: ' +
                                    src
                                )
                            );

                        },
                        timeout
                    );
            }

            // ============================================================
            // CHECK DEVELOPMENT MODE
            // ============================================================

            function isDevelopmentEnvironment() {

                if (!ROOT_DOMAIN) {
                    return false;
                }

                return (
                    ROOT_DOMAIN.indexOf(
                        '.example.com'
                    ) >= 0 ||

                    ROOT_DOMAIN.indexOf(
                        'localhost'
                    ) >= 0 ||

                    ROOT_DOMAIN.indexOf(
                        '127.0.0.1'
                    ) >= 0
                );
            }

            // ============================================================
            // INITIALIZE OBSERVER
            // ============================================================

            function codeIsReady() {

                if (!observerAvailable()) {

                    console.error(
                        '[LeoProxy] LeoEventObserver was not created by observer script'
                    );

                    sendMessage(
                        'LeoObserverProxyError-ObserverNotFound'
                    );

                    return;
                }

                if (
                    typeof window.LeoEventObserver.initFingerprint !== 'function'
                ) {

                    console.error(
                        '[LeoProxy] LeoEventObserver.initFingerprint() is unavailable'
                    );

                    sendMessage(
                        'LeoObserverProxyError-InitFingerprintNotFound'
                    );

                    return;
                }

                OBSERVER_SCRIPT_LOADED = true;

                /*
                 * Injected visitor ID can take precedence over
                 * fingerprint-generated identity.
                 */
                if (INJECTED_VISITOR_ID) {
                    window.LeoEventObserver.visitorId =
                        INJECTED_VISITOR_ID;
                }

                /*
                 * Fingerprint initialization
                 */
                try {

                    window.LeoEventObserver.initFingerprint(
                        function (fingerprintId) {

                            /*
                             * Only use generated visitor ID when
                             * the server did not inject one.
                             */
                            if (
                                !INJECTED_VISITOR_ID &&
                                typeof window.LeoEventObserver.getVisitorId === 'function'
                            ) {
                                window.LeoEventObserver.visitorId =
                                    window.LeoEventObserver.getVisitorId();
                            }

                            window.LeoEventObserver.fingerprintId =
                                fingerprintId || '';

                            OBSERVER_READY = true;

                            /*
                             * Notify parent iframe is loaded and ready.
                             */
                            var activeSessionKey = typeof window.LeoEventObserver.getSessionKey === 'function'
                                ? window.LeoEventObserver.getSessionKey(true) : '';
                            var activeVisitorId = window.LeoEventObserver.visitorId || (
                                typeof window.LeoEventObserver.getVisitorId === 'function' ? window.LeoEventObserver.getVisitorId() : ''
                            );

                            setTimeout(
                                function () {
                                    sendMessage('LeoObserverProxyLoaded');
                                    sendMessage({
                                        event: 'LeoObserverProxyReady',
                                        sessionKey: activeSessionKey,
                                        visitorId: activeVisitorId,
                                        fingerprintId: window.LeoEventObserver.fingerprintId || ''
                                    });
                                    sendMessage('LeoObserverProxyReady');
                                },
                                0
                            );

                            /*
                             * Flush calls that arrived
                             * before observer initialization.
                             */
                            scheduleQueueFlush();
                        }
                    );

                } catch (error) {

                    console.error(
                        '[LeoProxy] initFingerprint failed:',
                        error
                    );

                    sendMessage(
                        'LeoObserverProxyError-' +
                        (
                            error && error.message
                                ? error.message
                                : 'initFingerprint failed'
                        )
                    );
                }
            }

            // ============================================================
            // LOAD OBSERVER
            // ============================================================

            function loadLeoObserver() {
                var cbKey = String(Date.now());
                
                // Primary path: relative to proxy html (works across any host/domain)
                var primaryUrl = '../observer/leo.observer.js?cb=' + cbKey;
                var fallbackUrl1 = '/static/c360-web-sdk/observer/leo.observer.js?cb=' + cbKey;
                var fallbackUrl2 = '/c360-web-sdk/observer/leo.observer.js?cb=' + cbKey;
                var fallbackUrl3 = '/cdp-sdk/observer/leo.observer.js?cb=' + cbKey;

                function doLoadObserverScript(url, onFail) {
                    console.info('[LeoProxy] Loading observer from:', url);
                    loadScript(
                        url,
                        {
                            timeout: 10000,
                            callback: function () {
                                console.info('[LeoProxy] Observer script loaded successfully');
                                codeIsReady();
                            },
                            onError: function (err) {
                                console.warn('[LeoProxy] Failed loading ' + url + ':', err);
                                if (typeof onFail === 'function') {
                                    onFail();
                                } else {
                                    sendMessage('LeoObserverProxyError-ScriptLoadFailed');
                                }
                            }
                        }
                    );
                }

                function ensureFingerprintAndLoad() {
                    if (typeof window.Fingerprint2 === 'undefined') {
                        // Load fallback local hash.js if cdnjs was blocked
                        loadScript('../observer/hash.js?cb=' + cbKey, {
                            timeout: 5000,
                            callback: function() {
                                doLoadObserverScript(primaryUrl, function() {
                                    doLoadObserverScript(fallbackUrl1, function() {
                                        doLoadObserverScript(fallbackUrl2, function() {
                                            doLoadObserverScript(fallbackUrl3);
                                        });
                                    });
                                });
                            },
                            onError: function() {
                                doLoadObserverScript(primaryUrl, function() {
                                    doLoadObserverScript(fallbackUrl1, function() {
                                        doLoadObserverScript(fallbackUrl2, function() {
                                            doLoadObserverScript(fallbackUrl3);
                                        });
                                    });
                                });
                            }
                        });
                    } else {
                        doLoadObserverScript(primaryUrl, function() {
                            doLoadObserverScript(fallbackUrl1, function() {
                                doLoadObserverScript(fallbackUrl2, function() {
                                    doLoadObserverScript(fallbackUrl3);
                                });
                            });
                        });
                    }
                }

                ensureFingerprintAndLoad();
            }

            // ============================================================
            // INITIALIZE
            // ============================================================

            function init() {

                if (!parseConfig()) {
                    return;
                }

                /*
                 * Make initialization asynchronous so the DOM and
                 * externally loaded dependencies are ready.
                 */
                setTimeout(
                    function () {

                        loadLeoObserver();

                    },
                    0
                );
            }

            init();

            // ============================================================
            // OPTIONAL DEBUG API
            // ============================================================

            /*
             * Expose a small read-only-ish debug object.
             * Useful while testing iframe integration.
             */
            window.LeoObserverProxy = {

                getStatus: function () {

                    return {
                        rootDomain: ROOT_DOMAIN,
                        parentOrigin: PARENT_ORIGIN,
                        observerScriptLoaded:
                            OBSERVER_SCRIPT_LOADED,
                        observerReady:
                            OBSERVER_READY,
                        trackingQueueLength:
                            queueTracking.length,
                        profileQueueLength:
                            queueUpdating.length,
                        visitorId:
                            observerAvailable()
                                ? window.LeoEventObserver.visitorId
                                : null,
                        fingerprintId:
                            observerAvailable()
                                ? window.LeoEventObserver.fingerprintId
                                : null
                    };
                }
            };

        })();
    </script>
</body>

</html>
