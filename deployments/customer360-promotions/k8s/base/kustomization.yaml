# Base for customer360-promotions on VKS. Not deployed directly — deploy-promotions.sh
# generates ../generated/<env>/ on top of this with the image, the ConfigMap and the
# Secret resolved from the Terraform state of ../../../postgres and ../../../cache.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: customer360

resources:
  # Every resource for the service, in one file: the app (Deployment/Service/PDB)
  # and the HPA that scales it.
  - promotions.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: customer360-promotions
      app.kubernetes.io/part-of: customer360
