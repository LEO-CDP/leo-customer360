<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Engagement Workflow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #studio {
        height: 100vh;
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="workflow-studio.js"></script>
  </head>

  <body>
    <div id="studio"></div>
    <script>
      $("#studio").workflowStudio({
        title: "Customer Engagement Workflow",
        segmentName: "Frequent Travelers",
        segmentId: "123456",
        loadProfiles: function (segmentId) {
          const frame = document.querySelector("#studio iframe").contentWindow;
          window.loadedProfileSegmentId = segmentId;
          return frame.WorkflowCore.sampleProfiles(32, 42);
        },
        onClearCanvas: function (segmentId) {
          window.clearedSegmentId = segmentId;
        },
        onRunCampaign: function (workflow, segmentId, simulation) {
          window.lastRun = {
            workflow: workflow,
            segmentId: segmentId,
            simulation: simulation,
          };
        },
        onRecipeChange: function (recipeKey, workflow, segmentId) {
          window.lastRecipeChange = {
            recipeKey: recipeKey,
            workflow: workflow,
            segmentId: segmentId,
          };
        },
        onReady: function (segmentId) {
          window.studioReady = true;
          window.studioSegmentId = segmentId;
        },
        onChange: function (workflow) {
          window.lastWorkflow = workflow;
        },
      });
    </script>
  </body>
</html>
