# VKS-only Dagster settings: pull from the private registry, and stop the pod
# (instead of silently losing logs) if the vStorage bucket is unreachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: dagster
          env:
            - { name: DAGSTER_REQUIRE_S3, value: "true" }
