# Point the app tier at the GreenNode managed data services (from ../../../terraform
# outputs) and at public URLs. Fill in any placeholder before deploying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: c360-config
data:
  ENVIRONMENT: "production"

  # --- Managed vDB PostgreSQL (terraform output: postgres.host / .port) ---
  DB_HOST: "10.100.1.3"
  DB_PORT: "5432"
  DB_USER: "app_admin"
  KC_DB_URL: "jdbc:postgresql://10.100.1.3:5432/db_keycloak"

  # --- Redis: Docker Redis on the UAT api box (no managed MemStore in UAT) ---
  REDIS_HOST: "10.100.1.5"
  REDIS_PORT: "6580"

  # --- vStorage (S3) instead of MinIO ---
  S3_ENDPOINT: "https://hcm04.vstorage.vngcloud.vn"
  MINIO_BUCKET: "leo-customer360-uat"

  # --- Auth on, public URLs (must be browser-reachable) ---
  SSO_LOGIN: "true"
  SSO_LOGIN_URL: "https://beta.leocdp.com/auth"
  KEYCLOAK_HOSTNAME: "https://beta.leocdp.com/auth"
  FRONTEND_API_HOSTNAME: "https://beta.leocdp.com/c360api"
