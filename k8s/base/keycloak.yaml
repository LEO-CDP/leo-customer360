# Keycloak 26 (SSO). Stores realm state in the db_keycloak database. The db-init
# Job creates that database first (idempotent), using a plain postgres client
# image so it works against both in-cluster and managed Postgres.
# NOTE: no realm/client/user seed exists in the repo - create the `leocdp` realm
# manually, OR keep SSO_LOGIN=false (default) so the API uses header auth.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                echo "waiting for postgres..."; sleep 3;
              done
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -tc \
                "SELECT 1 FROM pg_database WHERE datname='db_keycloak'" | grep -q 1 \
              || psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -c "CREATE DATABASE db_keycloak"
              echo "db_keycloak ready"
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: c360-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: c360-config, key: DB_PORT } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: c360-config, key: DB_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: c360-secrets, key: DB_PASSWORD } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: keycloak/keycloak:26.7
          args: ["start-dev"]
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9000, name: management }
          env:
            - { name: KC_DB, value: postgres }
            - name: KC_DB_URL
              valueFrom: { configMapKeyRef: { name: c360-config, key: KC_DB_URL } }
            - name: KC_DB_USERNAME
              valueFrom: { configMapKeyRef: { name: c360-config, key: DB_USER } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: c360-secrets, key: DB_PASSWORD } }
            - name: KC_HOSTNAME
              valueFrom: { configMapKeyRef: { name: c360-config, key: KEYCLOAK_HOSTNAME } }
            - { name: KC_HTTP_PORT, value: "8080" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KEYCLOAK_ADMIN, value: admin }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: c360-secrets, key: KEYCLOAK_ADMIN_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  selector: { app: keycloak }
  ports:
    - { port: 8080, targetPort: 8080, name: http }
