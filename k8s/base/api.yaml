# customer360-api (FastAPI). envFrom pulls all shared config + secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: customer360-api:local
          ports:
            - { containerPort: 8008, name: http }
          envFrom:
            - configMapRef: { name: c360-config }
            - secretRef: { name: c360-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8008 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8008 }
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - { port: 8008, targetPort: 8008, name: http }
