# MinIO (S3-compatible) for local dev + a one-shot Job that creates the events
# bucket. In vks this is replaced by GreenNode vStorage (S3 endpoint in config).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels: { app: minio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: c360-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: c360-secrets, key: MINIO_ROOT_PASSWORD } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: { app: minio }
spec:
  selector: { app: minio }
  ports:
    - { port: 9000, targetPort: 9000, name: api }
    - { port: 9001, targetPort: 9001, name: console }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 3;
              done
              mc mb -p "local/$MINIO_BUCKET" || true
              echo "bucket ready: $MINIO_BUCKET"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: c360-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: c360-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: MINIO_BUCKET
              valueFrom: { configMapKeyRef: { name: c360-config, key: MINIO_BUCKET } }
