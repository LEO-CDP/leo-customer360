name: customer360

# =============================================================================
# this is clone of dev-docker-compose.yml, but without the SSO service 
# (for local development of the API without SSO, if SSO_LOGIN=false in .env)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

networks:
  customer360-network:
    name: customer360-network
    driver: bridge

volumes:
  customer360-pgdata:
    name: customer360-pgdata
  customer360-redisdata:
    name: customer360-redisdata
  customer360-miniodata:
    name: customer360-miniodata

services:
  # ---------------------------------------------------------------------------
  # 1) PostgreSQL 16 + PostGIS + pgvector + contrib, auto-provisioned with
  #    database-schema.sql on first start.
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    image: customer360-postgres:local
    container_name: customer360-postgres
    restart: unless-stopped
    <<: *default-hardening
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-customer360}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - customer360-pgdata:/var/lib/postgresql/data
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-customer360}"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ---------------------------------------------------------------------------
  # 2) Redis 8 - API response cache (see customer360-api/core/cache.py).
  # ---------------------------------------------------------------------------
  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    image: customer360-redis:local
    container_name: customer360-redis
    restart: unless-stopped
    <<: *default-hardening
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6580}:6580"
    volumes:
      - customer360-redisdata:/data
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6580 -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ---------------------------------------------------------------------------
  # 3) MinIO - local S3-compatible object storage, DEV ONLY. Lets you test
  #    file-based event ingestion (e.g. importing events from CSV/JSON dropped
  #    into a bucket, see docs/PLAN-EVENTS-API-IMPROVEMENTmd "Import from S3")
  #    against a real S3 API without touching production S3. NOT present in
  #    docker-compose.yml -- production uses the real S3 bucket instead.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: customer360-minio
    restart: unless-stopped
    <<: *default-hardening
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      # S3 API port.
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      # Web console port (login with MINIO_ROOT_USER/MINIO_ROOT_PASSWORD).
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - customer360-miniodata:/data
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 4) MinIO bucket bootstrap - one-shot: creates the default dev bucket
  #    (MINIO_BUCKET) used for testing file-based event ingestion, so it
  #    exists as soon as the stack comes up.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    container_name: customer360-minio-init
    restart: "no"
    <<: *default-hardening
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-customer360-events-dev}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - customer360-network
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "Bucket $$MINIO_BUCKET ready."

