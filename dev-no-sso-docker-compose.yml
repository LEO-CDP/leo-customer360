name: customer360

# =============================================================================
# this is clone of dev-docker-compose.yml, but without the SSO service 
# (for local development of the API without SSO, if SSO_LOGIN=false in .env)
# Mailpit is included in both variants for local SMTP capture.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

networks:
  customer360-network:
    name: customer360-network
    driver: bridge

volumes:
  customer360-pgdata:
    name: customer360-pgdata
  customer360-redisdata:
    name: customer360-redisdata
  customer360-miniodata:
    name: customer360-miniodata
  customer360-mailpitdata:
    name: customer360-mailpitdata

services:
  # ---------------------------------------------------------------------------
  # 1) PostgreSQL 16 + PostGIS + pgvector + contrib, auto-provisioned with
  #    database-schema.sql and init-core-database.sql on first start.
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    image: customer360-postgres:local
    container_name: customer360-postgres
    restart: unless-stopped
    <<: *default-hardening
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-customer360}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - customer360-pgdata:/var/lib/postgresql/data
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-customer360}"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ---------------------------------------------------------------------------
  # 2) Redis 8 - API response cache (see customer360-api/core/cache.py).
  # ---------------------------------------------------------------------------
  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    image: customer360-redis:local
    container_name: customer360-redis
    restart: unless-stopped
    <<: *default-hardening
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6580}:6580"
    volumes:
      - customer360-redisdata:/data
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6580 -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3) Mailpit - DEV ONLY SMTP capture for host-run email services.
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.27}
    container_name: customer360-mailpit
    restart: unless-stopped
    <<: *default-hardening
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
      TZ: ${MAILPIT_TIMEZONE:-UTC}
    ports:
      - "${MAILPIT_HOST_BIND:-127.0.0.1}:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_HOST_BIND:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    volumes:
      - customer360-mailpitdata:/data
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 4) Customer 360 AI Agent - host-run customer360-api calls localhost:8009.
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ./customer360-agent
      dockerfile: Dockerfile
    image: customer360-agent:local
    container_name: customer360-agent
    restart: unless-stopped
    init: true
    <<: *default-hardening
    env_file:
      - .env
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-customer360}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${C360_AGENT_HOST:-127.0.0.1}:${C360_AGENT_PORT:-8009}:8009"
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8009/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ---------------------------------------------------------------------------
  # 5) MinIO - local S3-compatible object storage, DEV ONLY. Lets you test
  #    file-based event ingestion (e.g. importing events from CSV/JSON dropped
  #    into a bucket, see docs/api-plans/PLAN-EVENTS-API-IMPROVEMENT.md "Import from S3")
  #    against a real S3 API without touching production S3. NOT present in
  #    docker-compose.yml -- production uses the real S3 bucket instead.
  # ---------------------------------------------------------------------------
  minio:
    image: pgsty/silo:${MINIO_VERSION:-RELEASE.2026-09-16T00-00-00Z}
    container_name: customer360-minio
    restart: unless-stopped
    <<: *default-hardening
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      # MinIO's console backend must reach the S3 API over the Docker network.
      # Host-side SDKs use S3_ENDPOINT_URL=https://s3dev.example.com instead.
      MINIO_SERVER_URL: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      # Public URL of the MinIO Web Console through Nginx.
      MINIO_BROWSER_REDIRECT_URL: ${S3_BROWSER_REDIRECT_URL:-https://s3dev.example.com/minio/}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      # S3 API port.
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      # Web console port (login with MINIO_ROOT_USER/MINIO_ROOT_PASSWORD).
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - customer360-miniodata:/data
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 6) MinIO bucket bootstrap - one-shot: creates the default dev bucket
  #    (MINIO_BUCKET) used for testing file-based event ingestion, so it
  #    exists as soon as the stack comes up.
  # ---------------------------------------------------------------------------
  minio-init:
    image: pgsty/silo:${MINIO_MC_VERSION:-RELEASE.2026-09-16T00-00-00Z}
    container_name: customer360-minio-init
    restart: "no"
    <<: *default-hardening
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-customer360-events-dev}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - customer360-network
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "Bucket $$MINIO_BUCKET ready."

  # ---------------------------------------------------------------------------
  # 7) CDP event data tracking API - DEV uses the in-network customer360-minio.
  # ---------------------------------------------------------------------------
  tracking-api:
    build:
      context: ./customer360-event-api
      dockerfile: Dockerfile
    image: customer360-event-api:local
    container_name: customer360-event-api
    restart: unless-stopped
    init: true
    <<: *default-hardening
    env_file:
      - .env
    environment:
      OBJECT_STORAGE_MODE: minio
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKETS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6580
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${C360_TRACKING_API_HOST:-127.0.0.1}:${C360_TRACKING_API_PORT:-8010}:8010"
    networks:
      - customer360-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
