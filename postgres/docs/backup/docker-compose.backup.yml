# Docker Compose backup sidecar for the Customer360 Postgres tier.
#
# Overlay onto the main stack so it shares the network and can reach the
# `postgres` service by name:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f postgres/docs/backup/docker-compose.backup.yml \
#     up -d pg-backup
#
# It runs pg_backup.sh on a cron loop (default 01:00 local) and offloads to
# vStorage. Reads DB_PASSWORD + AWS keys from the same .env as the main stack.
services:
  pg-backup:
    build:
      context: ./postgres/docs/backup
      dockerfile: Dockerfile.backup
    image: customer360-pg-backup:16
    container_name: customer360-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DATABASES: "customer360 db_keycloak"
      PG_DUMP_FORMAT: directory
      JOBS: "4"
      COMPRESS: zstd
      RETENTION_DAYS: "7"
      # vStorage / S3 offload (leave S3_* blank to keep backups local-only)
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_REGION: ${BACKUP_S3_REGION:-us-east-1}
      # Local hour:minute (24h) at which the daily backup fires. Container clock
      # is UTC unless you set TZ; default 18:00 UTC = 01:00 Asia/Ho_Chi_Minh.
      BACKUP_AT: ${BACKUP_AT:-1800}
    volumes:
      - customer360-pgbackups:/backups
    networks:
      - customer360-network
    # Run once on boot, then daily when the clock hits $BACKUP_AT (HHMM). A tiny
    # sleep-loop avoids needing a cron daemon in the image. For production
    # scheduling prefer the K8s CronJob (backup-cronjob.yaml).
    # NOTE: `$$` escapes Compose interpolation so the CONTAINER shell expands
    # these at runtime (a single `$` would be resolved by Compose at parse time).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "pg-backup sidecar up; daily at $${BACKUP_AT} (container TZ)"
        /usr/local/bin/pg_backup.sh || echo "initial backup failed (will retry on schedule)"
        while true; do
          if [ "$$(date +%H%M)" = "$${BACKUP_AT}" ]; then
            /usr/local/bin/pg_backup.sh || echo "scheduled backup failed"
            sleep 61   # skip past this minute so we don't fire twice
          fi
          sleep 30
        done

volumes:
  customer360-pgbackups:

networks:
  customer360-network:
    external: true
    name: customer360-network
