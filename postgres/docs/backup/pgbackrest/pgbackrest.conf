# pgBackRest config for the Customer360 physical/PITR track. See ../../04-pgbackrest-pitr.md
#
# SECRETS ARE NOT IN THIS FILE. Inject via environment variables:
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS
# (any option can be overridden by PGBACKREST_<OPTION_UPPERCASED_WITH_UNDERSCORES>.)

[global]
# --- Repository: vStorage (S3-compatible) ---
repo1-type=s3
repo1-s3-endpoint=hcm04.vstorage.vngcloud.vn   # use your zone's endpoint (hcm03/hcm04/...)
repo1-s3-uri-style=path                         # REQUIRED for non-AWS S3 (vStorage/MinIO)
repo1-s3-region=us-east-1                        # required even if the provider ignores it
repo1-s3-bucket=c360-prod-backups                # pre-provisioned by Terraform
repo1-path=/pgbackrest

# --- Encryption at rest (client-side); passphrase via PGBACKREST_REPO1_CIPHER_PASS ---
repo1-cipher-type=aes-256-cbc

# --- Efficiency: file bundling + block incremental (pgBackRest >= 2.52.1) ---
repo1-bundle=y
repo1-block=y

# --- Retention (GFS). expire runs automatically after each backup. ---
repo1-retention-full-type=time
repo1-retention-full=14                          # keep 14 days of full backups
repo1-retention-diff=4                           # keep 4 differentials

# --- Performance ---
process-max=4
compress-type=zst
compress-level=6
start-fast=y                                     # checkpoint immediately, don't wait
delta=y                                          # delta restore/backup by default
archive-async=y                                  # async WAL push/get for throughput
spool-path=/var/spool/pgbackrest

# --- Logging ---
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Lighter compression on the hot WAL-push path.
[global:archive-push]
compress-level=3

# --- Stanza: the Customer360 cluster ---
[c360]
pg1-path=/var/lib/postgresql/data                # MUST equal PGDATA. K8s: .../data/pgdata
pg1-port=5432
pg1-user=postgres
pg1-database=customer360
pg1-socket-path=/var/run/postgresql              # local control connection over unix socket
